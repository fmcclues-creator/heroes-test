<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pearl Diver · غوّاص اللؤلؤ</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<style>
:root{
  --ink:#10233f; --cream:#fff8ec; --sea:#1f8fc9; --sun:#ffc93c; --mint:#2fd39a; --berry:#ff5f8f; --pearl:#fff6fb; --line:#10233f;
  --font:'Baloo Bhaijaan 2',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#1f8fc9;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font-family:var(--font);color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:3px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;display:grid;place-items:center;padding:0}
#airWrap{margin:8px auto 0;max-width:420px;display:flex;align-items:center;gap:8px;color:#fff;-webkit-text-stroke:.5px var(--line)}
#airWrap b{font-size:16px;white-space:nowrap;font-weight:800}
.bar{flex:1;height:16px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden}
#air{height:100%;width:100%;background:linear-gradient(90deg,#7ff9ff,#2fd39a);transition:width .15s}
#air.low{background:linear-gradient(90deg,#ff5f6d,#ffb13c);animation:blink .5s infinite alternate}
@keyframes blink{to{filter:brightness(1.4)}}
#card{margin:10px auto 0;max-width:520px;background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:8px 14px;text-align:center;direction:rtl}
#card .tag{display:inline-block;font-size:13px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:0 10px;margin-bottom:2px}
#card .clue{font-size:clamp(18px,4.4vw,24px);font-weight:700;line-height:1.35}
#card .clue .emo{font-size:1.25em;vertical-align:-3px;margin-inline-start:6px}
.slots{display:flex;justify-content:center;gap:5px;margin-top:6px;direction:rtl;flex-wrap:wrap}
.slot{width:38px;height:44px;border:3px dashed #9aa3b8;border-radius:10px;display:grid;place-items:center;font-size:28px;font-weight:800;background:#fff}
.slot.given{border-style:solid;border-color:#c5cbd8;color:#5b6478;background:#f4f6fb}
.slot.got{border-style:solid;border-color:var(--line);background:var(--mint);color:#fff}
.slot.next{border-color:var(--sun);border-style:solid;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);font-size:clamp(26px,6.5vw,44px);font-weight:800;color:#fff;-webkit-text-stroke:2px var(--line);text-shadow:0 4px 0 var(--line);pointer-events:none;transition:opacity .25s;opacity:0;white-space:pre-line;text-align:center;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
#pointer{position:fixed;top:50%;font-size:40px;pointer-events:none;filter:drop-shadow(0 3px 0 var(--line));transform:translateY(-50%)}

/* touch joystick */
#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:130px;height:130px;border-radius:50%;background:#ffffff44;border:4px solid #ffffffaa;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;border:4px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* screens */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#0f5f99cc,#1f8fc9cc);overflow:auto}
.panel{background:var(--cream);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);padding:18px 18px 16px;width:min(560px,100%);text-align:center;position:relative;box-sizing:border-box}
h1{margin:30px 0 0;font-size:clamp(36px,9vw,56px);line-height:1.05;color:var(--pearl);-webkit-text-stroke:2px var(--line);text-shadow:0 5px 0 var(--line);font-weight:800}
h2{margin:4px 0 6px;font-size:24px}
.sub{margin:6px 0 12px;font-size:16px;line-height:1.45}
.langs{position:absolute;top:12px;inset-inline-start:12px;display:flex;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:#fff;font-weight:800;padding:2px 12px;font-size:14px}
.langs button.on{background:var(--ink);color:#fff}
.me{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:20px;background:#e6f6ff;padding:6px 14px 6px 6px;margin:6px 0 12px;box-shadow:0 4px 0 var(--line);text-align:start}
.me canvas{width:110px;height:110px;border-radius:14px;background:#bfe7ff}
.me b{font-size:26px;display:block}.me small{font-size:14px;font-weight:600}
.ages{display:flex;gap:6px;justify-content:center;align-items:center;margin:0 0 12px;flex-wrap:wrap;font-weight:800}
.age{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--line);padding:0}
.age.on{background:var(--sun)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lvl{border:3px solid var(--line);border-radius:16px;background:#fff;padding:6px 4px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--line);line-height:1.2}
.lvl small{display:block;font-weight:500;font-size:12px}
.lvl .st{font-size:13px;color:#d79a00;letter-spacing:1px}
.lvl.on{background:var(--sun)}
.lvl[disabled]{opacity:.45;cursor:default}
.go{width:100%;border:4px solid var(--line);border-radius:999px;background:var(--mint);color:#fff;font-size:26px;font-weight:800;padding:6px 0;box-shadow:0 5px 0 var(--line);-webkit-text-stroke:1px var(--line)}
.ghost{border:3px solid var(--line);border-radius:999px;background:#fff;font-weight:800;font-size:16px;padding:4px 16px;box-shadow:0 3px 0 var(--line)}
.howto{font-size:13px;text-align:start;background:#eef6ff;border-radius:14px;padding:8px 12px;margin:0 0 12px;line-height:1.55}
.howto b{display:inline-block;min-width:64px}
.stars{font-size:40px;color:#d9dde6;letter-spacing:4px}
.stars .on{color:var(--sun);-webkit-text-stroke:2px var(--line)}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.learned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl;margin:6px 0 12px}
.learned span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:0 8px;font-weight:700;font-size:16px}
.learned span.miss{background:#ffe1e8}
.row{display:flex;gap:8px;justify-content:center}
#endImg{width:110px;height:110px;margin:-6px auto 0}
/* reading scroll */
#read .panel{background:#fbf0d6;direction:rtl;text-align:right}
#read .scrollT{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;font-weight:800;font-size:14px}
#read .passage{font-size:clamp(19px,4.6vw,23px);line-height:1.75;margin:10px 0;font-weight:600}
#read .q{font-size:clamp(18px,4.4vw,21px);font-weight:800;margin:6px 0 10px}
#read .opts{display:grid;gap:8px}
#read .opt{border:3px solid var(--line);border-radius:16px;background:#fff;font-size:18px;font-weight:700;padding:8px 12px;text-align:right;box-shadow:0 3px 0 var(--line)}
#read .opt.ok{background:var(--mint);color:#fff}
#read .opt.no{background:#ffd3dc;opacity:.7}
#read .opt:disabled{color:inherit}#read .opt.ok:disabled{color:#fff}
#read .fb{min-height:28px;font-weight:800;margin-top:8px;text-align:center}
[dir=rtl] .howto{text-align:right}
</style>

<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="pills"><span class="pill" id="hearts"></span><span class="pill">🦪 <span id="score">0</span></span><span class="pill" id="lvlPill"></span></div>
    <div style="display:flex;gap:8px;pointer-events:none"><button class="iconbtn hidden" id="musicBtn" aria-label="Music">🎵</button><button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button></div>
  </div>
  <div id="airWrap"><b id="airLbl"></b><div class="bar"><div id="air"></div></div></div>
  <div id="card"></div>
</div>
<div id="pointer" class="hidden">➜</div>
<div id="toast"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>

<div class="screen" id="menu">
  <div class="panel">
    <div class="langs"><button id="langAr" class="on">عربي</button><button id="langEn">English</button></div>
    <h1 id="title"></h1>
    <p class="sub" id="tagline"></p>
    <div class="me"><canvas id="pvMe" width="220" height="220"></canvas><div><small id="meT"></small><b id="meName"></b></div></div>
    <div class="ages" id="ages"><span id="ageT"></span><button class="age" data-a="8"></button><button class="age" data-a="9"></button><button class="age" data-a="10"></button><button class="age" data-a="11"></button><button class="age" data-a="12"></button></div>
    <div class="levels" id="levels"></div>
    <div class="howto" id="howto"></div>
    <button class="go" id="playBtn"></button>
  </div>
</div>

<div class="screen hidden" id="read">
  <div class="panel">
    <span class="scrollT" id="readT"></span>
    <div class="passage" id="passage"></div>
    <div class="q" id="question"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
  </div>
</div>

<div class="screen hidden" id="pause">
  <div class="panel"><h2 id="pauseT"></h2><div class="row"><button class="go" id="resumeBtn" style="flex:1"></button></div><p></p><button class="ghost" id="quitBtn"></button></div>
</div>

<div class="screen hidden" id="end">
  <div class="panel">
    <canvas id="endImg" width="220" height="220"></canvas>
    <h2 id="endTitle"></h2>
    <div class="stars" id="endStars"></div>
    <div class="stats" id="endStats"></div>
    <div id="learnedT" style="font-weight:800"></div>
    <div class="learned" id="learned"></div>
    <div class="row"><button class="ghost" id="menuBtn"></button><button class="go" id="nextBtn" style="flex:1"></button></div>
  </div>
</div>

<script>
'use strict';
// ====================================================================================
//  Pearl Diver · غوّاص اللؤلؤ — Arabic spelling + reading comprehension for ages 8–12.
//  The child dives from an old Kuwaiti pearling boat. Each word: read the clue, then
//  collect the letter-pearls in order. Air runs out → swim to the surface to breathe
//  (or the crew pulls you up by the rope). Between words the captain hands over a
//  scroll: a short heritage passage + question. Finish → find the treasure chest.
// ====================================================================================
const $ = id => document.getElementById(id);
const SAVE_KEY = 'pearldiver.v1';
let save = { age: 0, unlocked: 0, stars: [0, 0, 0] };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (_) {}
let lang = 'ar';
try { const sl = sessionStorage.getItem('abdullahworld.lang'); if (sl === 'en' || sl === 'ar') lang = sl; } catch (_) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }

// ---------- THE CHILD (set per order — same block in every game of the bundle) ----------
// headFront / headBack: transparent PNG cut-outs of the child's character head (data URI or file next to this page).
// Leave them null to use the simple built-in placeholder head.
const CHILD = {
  name: { ar: 'عبدالعزيز', en: 'Abdulaziz' },
  gender: 'boy',
  skin: 0xb9784f, hair: 0x1a120c, hijab: false,
  suit: { main: 0x2f7de1, accent: 0xffa630, glow: 0x7ff9ff, veh: 0xff4d4d },
  age: 10,
  headFront: null, headBack: null,
  runModel: 'abdulaziz-run.gltf.json', swimModel: 'abdulaziz-swim.gltf.json', walkModel: 'abdulaziz-run.gltf.json'
};
function kidName() { return CHILD.name[lang] || CHILD.name.ar; }
const G = CHILD.gender === 'girl';

// ---------- text ----------
const T = {
  ar: {
    age: 'كم عمرك؟', title: 'غوّاص اللؤلؤ', tagline: 'اغطس من سفينة الغوص، اجمع لآلئ الحروف لتكتب الكلمات، واقرأ رسائل النّوخذة لتصل إلى الكنز! للأعمار من ٨ إلى ١٢ سنة.',
    me: 'الغوّاص', meG: 'الغوّاصة', go: 'هيّا يا',
    levels: [['الهير القريب', 'سهل'], ['جزيرة فيلكا', 'متوسط'], ['الهيرات البعيدة', 'صعب']],
    howto: '<b>اسبح</b> بالأسهم أو بعصا التحكّم<br><b>تنفّس</b> اصعد إلى سطح الماء أو ادخل فقاعات الهواء<br><b>اكتب</b> اجمع لآلئ الحروف بالتّرتيب',
    play: 'هيّا نغوص!', air: 'الهواء', spell: 'اجمع حروف الكلمة', miss1: 'اجمع الحرف الناقص', miss2: 'اجمع الحرفين الناقصين', lvl: 'الغوصة',
    good: 'أحسنت!', goodG: 'أحسنتِ!', notNext: 'ليس هذا الحرف', word: 'كلمة رائعة!', breath: 'تنفّس!', low: 'الهواء قليل!\nاصعد للأعلى', rope: 'سحبك البحّارة بالحبل', jelly: 'انتبه من قنديل البحر!', jellyG: 'انتبهي من قنديل البحر!',
    scroll: 'رسالة من النّوخذة', right: 'إجابة صحيحة!', wrong: 'اقرأ مرّة أخرى وحاول', cont: 'تابع الغوص',
    chest: 'ابحث عن صندوق الكنز!', found: 'وجدت الكنز!', foundG: 'وجدتِ الكنز!',
    pause: 'استراحة', resume: 'تابع', quit: 'القائمة', win: 'أحسنت يا {n}!', winG: 'أحسنتِ يا {n}!', over: 'انتهى يوم الغوص', learned: 'الكلمات التي تعلّمتها', accuracy: 'الدّقّة', next: 'الغوصة التالية', again: 'العب مرّة أخرى', menu: 'القائمة', locked: 'مقفلة'
  },
  en: {
    age: 'How old are you?', title: 'Pearl Diver', tagline: "Dive from an old pearling boat, collect letter-pearls to spell Arabic words, and read the captain's scrolls to reach the treasure! For ages 8–12.",
    me: 'Diver', meG: 'Diver', go: "Let's dive,",
    levels: [['The Near Bank', 'Easy'], ['Failaka Island', 'Medium'], ['The Far Banks', 'Hard']],
    howto: '<b>Swim</b> arrow keys or the joystick<br><b>Breathe</b> swim up to the surface or into air bubbles<br><b>Spell</b> collect the letter-pearls in order',
    play: "Let's dive!", air: 'Air', spell: 'Collect the letters', miss1: 'Find the missing letter', miss2: 'Find the two missing letters', lvl: 'Dive',
    good: 'Well done!', goodG: 'Well done!', notNext: 'Not that letter', word: 'Great word!', breath: 'Breathe!', low: 'Air is low!\nSwim up', rope: 'The crew pulled you up', jelly: 'Watch out for the jellyfish!', jellyG: 'Watch out for the jellyfish!',
    scroll: "A scroll from the captain", right: 'Correct!', wrong: 'Read it again and try', cont: 'Keep diving',
    chest: 'Find the treasure chest!', found: 'You found the treasure!', foundG: 'You found the treasure!',
    pause: 'Paused', resume: 'Resume', quit: 'Menu', win: 'Well done, {n}!', winG: 'Well done, {n}!', over: 'The diving day is over', learned: 'Words you learned', accuracy: 'Accuracy', next: 'Next dive', again: 'Play again', menu: 'Menu', locked: 'Locked'
  }
};
const t = k => { const v = T[lang][k]; if (G && T[lang][k + 'G'] !== undefined) return T[lang][k + 'G']; return v; };

// ---------- learning content (Modern Standard Arabic, ages 8–12) ----------
// WORDS[band]: [word (no tashkeel), emoji, clue]
const WORDS = [
  // Band 0 · ages 8–9
  [['محارة', '🦪', 'صدفةٌ يختبئُ في داخلِها اللّؤلؤ'], ['مرجان', '🪸', 'كائناتٌ بحريّةٌ ملوّنةٌ تبني الشّعابَ في قاعِ البحر'], ['سلحفاة', '🐢', 'حيوانٌ بطيءٌ له درعٌ صلب، تضعُ بيضَها في رمالِ الشّاطئ'], ['شراع', '⛵', 'قماشٌ يدفعُه الهواءُ فتسيرُ السّفينة'], ['موجة', '🌊', 'ماءٌ يرتفعُ وينخفضُ على سطحِ البحر'], ['صياد', '🎣', 'رجلٌ يخرجُ إلى البحرِ ليصطادَ السّمك'], ['رمال', '🏖️', 'حبّاتٌ صغيرةٌ تغطّي الشّاطئ'], ['حبل', '🪢', 'يربطُه الغوّاصُ بجسمِه ويشدُّه ليصعدَ إلى السّفينة'], ['سمكة', '🐟', 'حيوانٌ يعيشُ في الماءِ ويتنفّسُ بالخياشيم'], ['قارب', '🛶', 'سفينةٌ صغيرةٌ نحرّكُها بالمجاديف'], ['شمس', '☀️', 'نجمٌ يضيءُ النّهارَ ويُدفئُ البحرَ في الصّيف']],
  // Band 1 · age 10
  [['لؤلؤة', '⚪', 'حبّةٌ ثمينةٌ لامعةٌ تتكوّنُ داخلَ المحارة'], ['غواص', '🤿', 'ينزلُ إلى قاعِ البحرِ ليجمعَ المحار'], ['مرساة', '⚓', 'نُلقيها في الماءِ لتثبتَ السّفينةُ في مكانِها'], ['أخطبوط', '🐙', 'حيوانٌ بحريٌّ له ثماني أذرعٍ طويلة'], ['ميناء', '🚢', 'مكانٌ على الشّاطئ تقفُ فيه السّفن'], ['دلفين', '🐬', 'حيوانٌ ذكيٌّ يسبحُ ويقفزُ فوقَ الموج'], ['بحارة', '🚣', 'الرّجالُ الذين يعملونَ على ظهرِ السّفينة'], ['سرطان', '🦀', 'حيوانٌ بحريٌّ يتحرّكُ جانبيًّا وله مِلقطان'], ['خياشيم', '🐟', 'أعضاءٌ تتنفّسُ بها الأسماكُ تحتَ الماء'], ['مجداف', '🛶', 'خشبةٌ طويلةٌ يحرّكُ بها البحّارةُ القارب'], ['بوصلة', '🧭', 'أداةٌ تدلُّ البحّارَ على الاتّجاهات']],
  // Band 2 · ages 11–12
