<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letter Glider</title>
<meta name="theme-color" content="#4fb3ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed 3D chase view over Kuwait; journey bar and challenge card on top, steer buttons in the bottom corners, a big "up" button in the middle */
:root{
  --sky:#8fd3ff; --ink:#1d2a4a; --sun:#ffc93c; --leaf:#3fb85c; --coral:#ff5f6d; --teal:#18b5a6; --grape:#8a5cf0; --sea:#2f7de1; --paper:#fffaf0; --mist:rgba(255,255,255,.9);
  --font:"Baloo Bhaijaan 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2}
.row{display:flex;gap:7px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-size:18px;line-height:1.3;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.num{direction:ltr;font-variant-numeric:tabular-nums}
.homeBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;flex:none}
.homeBtn svg{width:20px;height:20px}
.journey{flex:1;min-width:0;height:22px;border:2px solid var(--ink);border-radius:999px;background:rgba(255,255,255,.7);position:relative;direction:ltr;box-shadow:0 3px 0 var(--ink)}
.journey .fill{position:absolute;inset:0 auto 0 0;}
[dir="rtl"] .journey .fill{inset:0 0 0 auto}
[dir="rtl"] .journey .fill{background:linear-gradient(270deg,#8ec5ff,#18b5a6)}
.journey .fill{border-radius:999px;background:linear-gradient(90deg,#8ec5ff,#18b5a6);width:0}
.journey .me{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--ink);background:#fff center/cover;box-shadow:0 2px 0 var(--ink)}
.journey .mark{position:absolute;top:50%;transform:translate(-50%,-50%);font-family:var(--emoji);font-size:14px;line-height:1}
.letters{display:flex;flex-wrap:wrap;gap:3px}
.chip{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:13.5px;line-height:1;border:2px dashed rgba(29,42,74,.45);background:rgba(255,255,255,.6);color:rgba(29,42,74,.45)}
.chip.got{border:2px solid var(--ink);color:#fff;box-shadow:0 2px 0 var(--ink);-webkit-text-stroke:.6px var(--ink)}
.chip.next{border:2px solid var(--ink);background:#fff6d6;color:var(--ink);animation:pulse 1s ease-in-out infinite}
.card2{align-self:center;display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:6px 14px 6px 10px;max-width:100%}
.card2 .pic{font-family:var(--emoji);font-size:40px;line-height:1}
.card2 .col{display:grid;gap:2px;justify-items:center}
.card2 .ask{font-weight:700;font-size:15px;line-height:1.25;max-width:190px;text-align:center}
.bigL{min-width:52px;height:52px;padding:0 6px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:38px;line-height:1;color:#fff;background:var(--grape);border:3px solid var(--ink);-webkit-text-stroke:1px var(--ink);box-shadow:0 3px 0 var(--ink)}
.slots{display:flex;gap:4px}
.slot{width:32px;height:36px;border-radius:9px;border:2px dashed rgba(29,42,74,.45);display:grid;place-items:center;font-weight:800;font-size:22px;line-height:1;background:#fff}
.slot.next{border:2px solid var(--ink);background:#fff6d6;animation:pulse 1s ease-in-out infinite}
.slot.got{border:2px solid var(--ink);color:#fff;-webkit-text-stroke:.7px var(--ink);box-shadow:0 2px 0 var(--ink)}
@keyframes pulse{50%{transform:scale(1.08)}}
.steer{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:92px;height:92px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 var(--ink);z-index:3;touch-action:none;display:grid;place-items:center;padding:0}
.steer svg{width:44px;height:44px}
.steer.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:var(--sun)}
#leftBtn{left:calc(max(14px,env(safe-area-inset-left,0px)) + 4px)}
#rightBtn{right:calc(max(14px,env(safe-area-inset-right,0px)) + 4px)}
.upBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:96px;height:96px;border-radius:30px;border:3px solid var(--ink);background:var(--sea);box-shadow:0 5px 0 var(--ink);z-index:3;touch-action:none;display:grid;place-items:center;padding:0}
.upBtn svg{width:50px;height:50px}
.upBtn.down{transform:translateX(-50%) translateY(4px);box-shadow:0 1px 0 var(--ink)}
.upBtn.off{opacity:.4}
.count{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-weight:800;font-size:96px;line-height:1;color:var(--sun);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);z-index:4;pointer-events:none;white-space:nowrap}
.toast{position:fixed;left:50%;top:44%;transform:translateX(-50%);font-weight:800;font-size:26px;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);z-index:2;pointer-events:none;transition:opacity .4s, transform .4s;white-space:pre-line;text-align:center;width:max-content;max-width:calc(100vw - 32px);line-height:1.25}
.toast.off{opacity:0;transform:translateX(-50%) translateY(-10px)}
.pop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);display:grid;place-items:center;gap:8px;z-index:2;pointer-events:none;transition:opacity .35s, transform .35s}
.pop.off{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.pop .big{min-width:104px;height:104px;padding:0 16px;border-radius:28px;display:grid;place-items:center;font-weight:800;font-size:72px;line-height:1;color:#fff;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;background:var(--teal)}
.pop .big.emo{font-family:var(--emoji);-webkit-text-stroke:0;background:#fff}
.pop .nm{font-weight:800;font-size:22px;background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:0 14px}
.post{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 172px);transform:translateX(-50%) rotate(-2deg);width:min(300px,82vw);background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:10px 14px 12px;z-index:3;pointer-events:none;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;transition:opacity .4s, transform .4s}
.post.off{opacity:0;transform:translateX(-50%) translateY(-20px) rotate(-6deg)}
.post .ic{grid-row:span 2;width:54px;height:54px;border-radius:12px;background:#e8f6ff;display:grid;place-items:center;font-family:var(--emoji);font-size:34px}
.post .ic svg{width:42px;height:42px}
.post b{font-size:17px;line-height:1.15}
.post span{font-size:13.5px;line-height:1.35;font-weight:500}
.post .stamp{position:absolute;top:-12px;inset-inline-end:-10px;background:var(--coral);color:#fff;font-weight:800;font-size:11px;border:2px solid var(--ink);border-radius:8px;padding:1px 7px;transform:rotate(8deg)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 80px) calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;background:linear-gradient(180deg,rgba(143,211,255,.05),rgba(29,42,74,.38))}
.card{width:min(440px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:18px 20px 22px;text-align:center;display:grid;gap:12px;position:relative}
.hero{display:block;height:140px;width:auto;margin:-96px auto -8px;filter:drop-shadow(0 6px 0 rgba(29,42,74,.22))}
.card h1{font-weight:800;font-size:clamp(38px,11vw,54px);line-height:1.05;margin:0;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-wrap:balance}
.card h2{font-weight:800;font-size:30px;margin:0;line-height:1.1;text-wrap:balance}
.card h3{font-weight:800;font-size:17px;margin:0}
.card p{margin:0;font-size:16px;line-height:1.5;font-weight:500}
.lang{position:absolute;top:12px;inset-inline-end:12px;display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;z-index:1}
.lang button{border:0;background:transparent;font-family:var(--font);font-weight:800;font-size:14px;padding:3px 11px;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:7px 4px 6px;font-family:var(--font);color:var(--ink);cursor:pointer;display:grid;min-width:0}
.lvl .n{font-weight:800;font-size:20px;line-height:1.15}
.lvl .nm{font-size:12px;font-weight:700;line-height:1.25}
.lvl[aria-pressed="true"]{background:var(--sun);box-shadow:0 4px 0 var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;text-align:start;font-size:14px;font-weight:500;background:rgba(143,211,255,.25);border-radius:16px;padding:9px 14px;line-height:1.4}
.keys b{font-weight:800}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.stars3{font-size:44px;line-height:1;letter-spacing:4px;color:#d9dfeb;-webkit-text-stroke:2px var(--ink)}
.stars3 .on{color:var(--sun)}
.report{background:#f3f8ff;border:2px solid rgba(29,42,74,.25);border-radius:16px;padding:10px 12px;text-align:start;display:grid;gap:6px}
.report h3{font-size:15px}
.report .letters{gap:4px}
.report .chip{width:26px;height:26px;font-size:15px}
.report small{font-size:13px;opacity:.75}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go{font-family:var(--font);font-weight:800;font-size:24px;line-height:1.2;border:3px solid var(--ink);background:var(--leaf);color:#fff;border-radius:18px;padding:9px 20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;flex:1 1 auto}
.go.alt{background:#fff;color:var(--ink);-webkit-text-stroke:0;font-size:19px;flex:0 1 auto;display:flex;align-items:center;gap:8px;justify-content:center}
.go.alt svg{width:22px;height:22px;flex:none}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.st{aspect-ratio:3/4;border-radius:16px;background:#fff;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink),0 4px 0 2px var(--ink);display:grid;place-items:center;align-content:center;gap:2px;position:relative;overflow:hidden;max-width:100%;padding:4px}
.st:nth-child(3n){transform:rotate(-3deg)}.st:nth-child(3n+1){transform:rotate(2deg)}
.st .e{font-family:var(--emoji);font-size:36px;line-height:1.1}
.st .e svg{width:40px;height:40px}
.st .w{font-weight:800;font-size:13px;line-height:1.15;text-align:center}
.st.locked{background:#e8edf5;box-shadow:0 0 0 2px rgba(29,42,74,.3);transform:none}
.st.locked .e{filter:grayscale(1) brightness(.4);opacity:.25}
.st.locked .w{opacity:.35}
.st.new{animation:stk .6s ease-out}
@keyframes stk{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.1) rotate(4deg)}}
.st .badge{position:absolute;top:4px;inset-inline-end:4px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:0 6px;line-height:1.6}
.albumHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.albumHead h2{font-size:26px}
.closeBtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-family:var(--font);font-weight:800;font-size:20px;cursor:pointer;flex:none}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tabs button{font-family:var(--font);font-weight:800;font-size:14px;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.postList{display:grid;gap:8px;text-align:start}
.pc{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 10px}
.pc .ic{grid-row:span 2;width:46px;height:46px;border-radius:10px;background:#e8f6ff;display:grid;place-items:center;font-family:var(--emoji);font-size:28px}
.pc .ic svg{width:36px;height:36px}
.pc b{font-size:15px}.pc span{font-size:13px;line-height:1.35}
.pc.locked{opacity:.4;filter:grayscale(1)}
@media (prefers-reduced-motion: reduce){.toast,.pop,.post{transition:none}.slot.next,.chip.next,.st.new{animation:none}}
.worldBtn{position:absolute;top:12px;inset-inline-start:12px;display:flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:2px 10px 2px 6px;font-family:var(--font,inherit);font-weight:800;font-size:13px;color:var(--ink);text-decoration:none;z-index:1}
.worldBtn svg{width:18px;height:18px;flex:none}
</style>

<canvas id="game" tabindex="0" aria-label="Letter Glider"></canvas>

<div class="hud" id="hud" hidden>
  <div class="row">
    <button class="homeBtn" id="homeBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M6 10v9h4.5v-5h3v5H18v-9" fill="none" stroke="#1d2a4a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="journey" id="journey"><div class="fill" id="jFill"></div><div class="me" id="jMe"></div></div>
    <div class="pill num" id="time">0:00</div>
  </div>
  <div class="letters" id="letterStrip"></div>
  <div class="card2" id="chCard" hidden></div>
</div>
<div class="count" id="count" hidden>3</div>
<div class="toast off" id="toast"></div>
<div class="pop off" id="pop"><div class="big" id="popBig">ب</div><div class="nm" id="popName"></div></div>
<div class="post off" id="post"><span class="stamp" id="postStamp"></span><div class="ic" id="postIc"></div><b id="postName"></b><span id="postFact"></span></div>
<button class="steer" id="leftBtn" hidden aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="#1d2a4a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button class="steer" id="rightBtn" hidden aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="#1d2a4a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button class="upBtn" id="upBtn" hidden aria-label="Fly up"><svg viewBox="0 0 24 24"><path d="M5 14l7-7 7 7M5 20l7-7 7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<div class="overlay" id="menu">
  <div class="card">
    <a class="worldBtn" id="worldBtn" href="index.html" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#8fd3ff" stroke="#1d2a4a" stroke-width="2"/><path d="M7 10c2-1 3 1 5 0s2-3 4-2M8 15c2 1 4-1 6 0" fill="none" stroke="#3fb85c" stroke-width="2.4" stroke-linecap="round"/></svg><span id="worldLbl"></span></a>
    <div class="lang" role="group" aria-label="Language"><button id="langEn" aria-pressed="true">English</button><button id="langAr" aria-pressed="false">عربي</button></div>
    <img class="hero" id="heroImg" alt="">
    <h1 data-t="title">Letter Glider</h1>
    <p data-t="intro"></p>
    <div class="levels" id="levelBtns"></div>
    <div class="keys" id="keys"></div>
    <div class="btns"><button class="go alt" id="albumBtn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="#bfe6ff" stroke="#1d2a4a" stroke-width="2"/><path d="M3 9h18" stroke="#1d2a4a" stroke-width="2"/><circle cx="16.5" cy="14" r="2.3" fill="#ff5f6d" stroke="#1d2a4a" stroke-width="1.5"/></svg><span id="albumLbl"></span></button><button class="go" id="playBtn" data-t="play">Fly!</button></div>
  </div>
</div>
<div class="overlay" id="endCard" hidden>
  <div class="card">
    <img class="hero" id="endImg" alt="">
    <h2 id="endTitle"></h2>
    <div class="stars3" id="endStars"></div>
    <p id="endText"></p>
    <div class="stats" id="endStats"></div>
    <div class="report" id="report"></div>
    <div id="newWrap" hidden><h3 id="newTitle"></h3><div class="stickers" id="newStickers" style="margin-top:8px"></div></div>
    <div class="btns"><button class="go alt" id="menuBtn" data-t="menu"></button><button class="go" id="againBtn"></button></div>
  </div>
</div>
<div class="overlay" id="album" hidden>
  <div class="card">
    <div class="albumHead"><h2 id="albumTitle"></h2><button class="closeBtn" id="albumClose" aria-label="Close">✕</button></div>
    <p id="albumCount"></p>
    <div class="tabs"><button id="tabPost" aria-pressed="true"></button><button id="tabPics" aria-pressed="false"></button><button id="tabSky" aria-pressed="false"></button></div>
    <div id="albumGrid"></div>
  </div>
</div>

        const d = Math.hypot(P.x - b.g.position.x, P.y - (b.g.position.y - 2.4), P.z - b.g.position.z);
        if (d < 4.2) {

}
function finishGate(delay) { const g = gate; gate = null; if (g) { for (const b of g.balloons) if (!b.popped) dropGateObj(b.g); if (g.nest) { g.nest.life = 1.5; fadingNests.push(g.nest); } } gateDelay = delay; }
const fadingNests = [];
function onGood(b) {
  addGood(b.c); sfx.pop(); P.cheer = 1;
  if (diff === 0) { stats.letters++; pop(b.c, lang === 'ar' ? lname(b.c) : '', LCOLS[abcPos % 6]); sayLetter(b.c, lname(b.c)); abcPos = (abcPos + 1) % L_().length; save.abc[lang] = abcPos; save.abcCount[lang] = (save.abcCount[lang] || 0) + 1; persist(); drawStrip(); finishGate(0.2); }
  else if (chall.type === 'bird') { stats.fed++; sfx.tweet(); pop(chall.pic[1], chall.pic[0], '#fff', true); sayWord(chall.pic[0], 'glide-yum'); toast(t('yes'), 1.2); if (!save.pics[lang][chall.pic[0]]) { save.pics[lang][chall.pic[0]] = 1; persist(); earned.push({ e: chall.pic[1], w: chall.pic[0] }); } if (gate.nest) { gate.nest.happy = 1.5; happyNests.push(gate.nest); } finishGate(1.2); nextChallenge(); }
  else { chall.pos++; pop(b.c, '', chall.color); sayLetter(b.c, lname(b.c)); drawChallenge(); if (chall.pos >= chall.chars.length) { stats.words++; sfx.win(); const w = chall.text, pic = chall.pic; setTimeout(() => sayWord(w, 'praise'), 400); pop(pic, w, '#fff', true); if (!save.pics[lang][w]) { save.pics[lang][w] = 1; persist(); earned.push({ e: pic, w }); } finishGate(1.4); nextT = 1.2; } else finishGate(0.2); }
}
function onWrong(b) {
  dbg.wrong++;
  sfx.wrong(); toast(vt('no', 'glide-no', 'now'), 1); addMiss(gate.target); P.vy -= 2;
  if (gate.nest) { gate.nest.sad = 0.8; happyNests.push(gate.nest); }
  if (diff === 1) { finishGate(1.0); nextChallenge(); } else finishGate(0.6);
}
function onMissed() { dbg.miss++; if (P.idx < N - 140) addMiss(gate.target); if (diff === 1) { finishGate(0.6); nextChallenge(); } else finishGate(0.3); }
const happyNests = []; const dbg = { spawn: 0, wrong: 0, miss: 0, rings: 0, ringHits: 0 };

// ================= visuals =================
const camPos = new V3(), camLook = new V3(); let camYaw = 0, menuT = 0;
function visuals(dt) {
  G.root.position.set(P.x, P.y, P.z); G.root.rotation.y = P.h;
  G.tilt.rotation.z = -P.steer * 0.35; G.tilt.rotation.x = -P.vy * 0.02;
  G.wing.rotation.z = Math.sin(time * 1.3) * 0.03;
  G.legsG.rotation.x = Math.sin(time * 2) * 0.1;
  const cheer = P.cheer > 0 || state === 'landed' || state === 'results';
  G.arms.forEach((a, i) => { a.rotation.z = (i ? -1 : 1) * -0.25 + (cheer ? (i ? 1 : -1) * Math.sin(time * 10) * 0.3 : 0); });
  { const fx = Math.sin(P.h), fz = Math.cos(P.h), cx = camera.position.x - P.x, cz = camera.position.z - P.z; const front = fx * cx + fz * cz > 0 || P.cheer > 0.5; G.front.visible = front; G.back.visible = !front; }
  // guide star ahead on the route
  { const k = Math.min(N - 1, P.idx + 34), p = routeAt(k, 0); const gy = Math.max(p.y, P.y * 0.6 + p.y * 0.4); guide.g.position.lerp(new V3(p.x, gy + 3 + Math.sin(time * 2) * 0.6, p.z), Math.min(1, 3 * dt)); guide.g.rotation.y = Math.atan2(camera.position.x - guide.g.position.x, camera.position.z - guide.g.position.z); guide.g.rotation.z = Math.sin(time * 3) * 0.15;
    guide.head = (guide.head + 1) % guide.n; guide.pos[guide.head * 3] = guide.g.position.x; guide.pos[guide.head * 3 + 1] = guide.g.position.y; guide.pos[guide.head * 3 + 2] = guide.g.position.z; guide.trail.geometry.attributes.position.needsUpdate = true;
    guide.g.visible = guide.trail.visible = state !== 'menu' && P.idx < N - 60; }
  for (const th of thermals) { const a = th.pts.geometry.attributes.position; for (let j = 0; j < th.n; j++) { const f = j / th.n, ang = time * 2 + f * 40, r = 2 + f * 7, y = th.y0 + ((f * 90 + time * 8) % 90); a.array[j * 3] = th.x + Math.cos(ang) * r; a.array[j * 3 + 1] = y; a.array[j * 3 + 2] = th.z + Math.sin(ang) * r; } a.needsUpdate = true; }
  if (gate) for (const b of gate.balloons) if (!b.popped) { b.g.position.y = b.alt + Math.sin(time * 2 + b.lat) * 0.4; if (b.g.userData.glow) b.g.userData.glow.material.opacity = 0.6 + Math.sin(time * 6) * 0.3; }
  if (gate && gate.nest) gate.nest.chick.position.y = 2.2 + Math.abs(Math.sin(time * 4)) * 0.25;
  for (let i = happyNests.length - 1; i >= 0; i--) { const n = happyNests[i]; if (n.happy > 0) { n.happy -= dt; n.chick.position.y = 2.2 + Math.abs(Math.sin(time * 12)) * 0.9; n.chick.rotation.y += dt * 8; } else if (n.sad > 0) { n.sad -= dt; n.chick.rotation.y = Math.sin(time * 20) * 0.5; } else happyNests.splice(i, 1); }
  for (let i = fadingNests.length - 1; i >= 0; i--) { const n = fadingNests[i]; n.life -= dt; if (n.life <= 0) { dropGateObj(n.g); fadingNests.splice(i, 1); } }
  if (writing && writing.sprite && writing.showT > 0) writing.sprite.material.opacity = Math.min(1, writing.showT);
  for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.life -= dt; q.v.y -= 14 * dt; q.m.position.addScaledVector(q.v, dt); q.m.rotation.x += dt * 6; q.m.scale.setScalar(Math.max(0.01, q.life)); if (q.life <= 0) { scene.remove(q.m); parts.splice(i, 1); } }
  for (const f of anim) f(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.add('off'); }
  if (popT > 0) { popT -= dt; if (popT <= 0) $('pop').classList.add('off'); }
  if (postT > 0) { postT -= dt; if (postT <= 0) $('post').classList.add('off'); }
  if (windNode) { const on = state === 'fly' || state === 'count'; windNode.g.gain.value += ((on ? 0.02 + P.v * 0.0015 : 0) - windNode.g.gain.value) * Math.min(1, 3 * dt); windNode.f.frequency.value = 300 + P.v * 25; }
  if (state === 'fly' || state === 'count') { const f = Math.min(1, P.idx / (N - 1)); $('jFill').style.width = (f * 100) + '%'; $('jMe').style.left = ((lang === 'ar' ? 1 - f : f) * 100) + '%'; $('time').textContent = fmt(flightT); $('upBtn').classList.toggle('off', P.idx > N - 140); }
  // camera
  let want, look, rate = 6;
  if (state === 'menu') { menuT += dt; const a = menuT * 0.2 + 0.6; want = new V3(P.x + Math.sin(P.h + a) * 9, P.y + 3, P.z + Math.cos(P.h + a) * 9); look = new V3(P.x, P.y + 2.5, P.z); rate = 2.5; }
  else if (state === 'landed' || state === 'results') { const fx = Math.sin(P.h), fz = Math.cos(P.h); want = new V3(P.x + fx * 7 + fz * 3, P.y + 3.5, P.z + fz * 7 - fx * 3); look = new V3(P.x, P.y + 2.2, P.z); rate = 2.5; }
  else { camYaw += angDiff(camYaw, P.h) * Math.min(1, 3.5 * dt); const fx = Math.sin(camYaw), fz = Math.cos(camYaw); want = new V3(P.x - fx * 16, P.y + 7 - P.vy * 0.15, P.z - fz * 16); look = new V3(P.x + fx * 12, P.y + 1.5, P.z + fz * 12); rate = 8; }
  if (state !== 'fly' && state !== 'count') camYaw = Math.atan2(look.x - want.x, look.z - want.z);
  const k = 1 - Math.exp(-rate * dt); camPos.lerp(want, k); camLook.lerp(look, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  const fov = baseFov + Math.max(0, P.v - 15) * 0.6; camera.fov += (fov - camera.fov) * Math.min(1, 3 * dt); camera.updateProjectionMatrix();
  sky.position.copy(camera.position); sunSprite.position.set(camera.position.x + 500, camera.position.y + 360, camera.position.z + 700);
  light.position.set(P.x + 30, P.y + 60, P.z + 20); light.target.position.set(P.x, P.y, P.z);
}

// ================= boot =================
buildWorld(); buildLeg(diff); placeStart(); applyLang();
camPos.set(P.x + 9, P.y + 3, P.z + 9); camLook.set(P.x, P.y + 2, P.z);
if (document.fonts && document.fonts.load) document.fonts.load('800 170px "Baloo Bhaijaan 2"', 'أبتABC').then(() => { for (const k in texCache) if (k[0] === 'L') delete texCache[k]; }).catch(() => {});
const STEP = 1 / 60; let acc = 0, last = performance.now();
function frame(now) { requestAnimationFrame(frame); const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt; let n = 0; while (acc >= STEP && n < 6) { sim(STEP); acc -= STEP; n++; } if (n === 6) acc = 0; visuals(dt); renderer.render(scene, camera); }
window.__glider = { sim, visuals, render: () => renderer.render(scene, camera), get state() { return state; }, P, get gate() { return gate; }, get writing() { return writing; }, get stats() { return Object.assign({ stars: starsWon, earned: earned.length, idx: P.idx, N }, stats, dbg); } };
requestAnimationFrame(frame);
})();
