<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Heroes · أبطال الكلمات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<style>
:root{
  --ink:#1b2440; --cream:#fff8ec; --sky:#4fb3ff; --sun:#ffc93c; --mint:#2fd39a; --berry:#ff5f8f; --violet:#8a63ff; --line:#1b2440;
  --font:'Baloo Bhaijaan 2',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#4fb3ff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font-family:var(--font);color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:3px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .hrt{color:var(--berry)}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;display:grid;place-items:center;padding:0}
#energyWrap{margin:8px auto 0;max-width:420px;display:flex;align-items:center;gap:8px}
#energyWrap b{font-size:15px;white-space:nowrap}
.bar{flex:1;height:16px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden}
#energy{height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--berry));transition:width .3s}
#energy.full{animation:glow .6s infinite alternate}
@keyframes glow{to{filter:brightness(1.35)}}
#card{margin:10px auto 0;max-width:520px;background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:8px 14px;text-align:center;direction:rtl}
#card .tag{display:inline-block;font-size:13px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:0 10px;margin-bottom:2px}
#card .clue{font-size:clamp(18px,4.4vw,24px);font-weight:700;line-height:1.35}
#card .clue .emo{font-size:1.25em;vertical-align:-3px;margin-inline-start:6px}
.slots{display:flex;justify-content:center;gap:5px;margin-top:6px;direction:rtl;flex-wrap:wrap}
.slot{width:38px;height:44px;border:3px dashed #9aa3b8;border-radius:10px;display:grid;place-items:center;font-size:28px;font-weight:800;background:#fff}
.slot.given{border-style:solid;border-color:#c5cbd8;color:#5b6478;background:#f4f6fb}
.slot.got{border-style:solid;border-color:var(--line);background:var(--mint);color:#fff}
.slot.next{border-color:var(--sun);border-style:solid;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(28px,7vw,48px);font-weight:800;color:#fff;-webkit-text-stroke:2px var(--line);text-shadow:0 4px 0 var(--line);pointer-events:none;transition:opacity .25s;opacity:0;white-space:pre-line;text-align:center;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}

/* touch controls */
#touch{position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.tbtn{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:4px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);font-size:32px;display:grid;place-items:center;padding:0;font-weight:800;touch-action:none}
.tbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tgroup{display:flex;gap:12px;align-items:flex-end}
#transformBtn{width:auto;border-radius:999px;padding:0 20px;height:62px;font-size:20px;background:var(--sun)}
#transformBtn.ready{animation:glow .5s infinite alternate}
#transformBtn[disabled]{opacity:.45}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#4fb3ffcc,#8fd3ffcc);overflow:auto}
.panel{background:var(--cream);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);padding:18px 18px 16px;width:min(560px,100%);text-align:center;position:relative}
h1{margin:30px 0 0;font-size:clamp(36px,9vw,56px);line-height:1.05;color:var(--sun);-webkit-text-stroke:2px var(--line);text-shadow:0 5px 0 var(--line);font-weight:800}
h2{margin:4px 0 6px;font-size:24px}
.sub{margin:6px 0 12px;font-size:16px;line-height:1.45}
.langs{position:absolute;top:12px;inset-inline-start:12px;display:flex;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:#fff;font-weight:800;padding:2px 12px;font-size:14px}
.langs button.on{background:var(--ink);color:#fff}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.hero{border:3px solid var(--line);border-radius:20px;background:#fff;padding:8px 6px;box-shadow:0 4px 0 var(--line);font-weight:800;font-size:18px}
.hero canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:14px}
.vehs .hero canvas{aspect-ratio:3/2}
.heroes .hero{padding:4px 6px 6px}
.hero small{display:block;font-weight:500;font-size:13px}
.me{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:20px;background:#fff3c4;padding:6px 14px 6px 6px;margin:6px 0 10px;box-shadow:0 4px 0 var(--line)}
.me canvas{width:120px;height:120px;border-radius:14px;background:#fff}
.me b{font-size:26px;display:block}.me small{font-size:14px;font-weight:600}
.hero.on{background:#fff3c4;outline:4px solid var(--sun)}
.ages{display:flex;gap:6px;justify-content:center;align-items:center;margin:0 0 12px;flex-wrap:wrap;font-weight:800}
.age{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--line);padding:0}
.age.on{background:var(--sun)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lvl{border:3px solid var(--line);border-radius:16px;background:#fff;padding:6px 4px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--line);line-height:1.2}
.lvl small{display:block;font-weight:500;font-size:12px}
.lvl .st{font-size:13px;color:#d79a00;letter-spacing:1px}
.lvl.on{background:var(--sun)}
.lvl[disabled]{opacity:.45;cursor:default}
.go{width:100%;border:4px solid var(--line);border-radius:999px;background:var(--mint);color:#fff;font-size:26px;font-weight:800;padding:6px 0;box-shadow:0 5px 0 var(--line);-webkit-text-stroke:1px var(--line)}
.ghost{border:3px solid var(--line);border-radius:999px;background:#fff;font-weight:800;font-size:16px;padding:4px 16px;box-shadow:0 3px 0 var(--line)}
.howto{font-size:13px;text-align:start;background:#eef6ff;border-radius:14px;padding:8px 12px;margin:0 0 12px;line-height:1.55}
.howto b{display:inline-block;min-width:64px}
.stars{font-size:40px;color:#d9dde6;letter-spacing:4px}
.stars .on{color:var(--sun);-webkit-text-stroke:2px var(--line)}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.learned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl;margin:6px 0 12px}
.learned span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:0 8px;font-weight:700;font-size:16px}
.learned span.miss{background:#ffe1e8}
.row{display:flex;gap:8px;justify-content:center}
#endImg{width:110px;height:110px;margin:-6px auto 0}
[dir=rtl] .howto{text-align:right}

/* hero card: the child's own 3D character, turning slowly */
.me{display:flex;align-items:center;gap:16px;border:3px solid var(--line);border-radius:26px;background:linear-gradient(135deg,#fff3c4,#ffd29a);padding:10px 18px 10px 10px;margin:8px 0 14px;box-shadow:0 5px 0 var(--line);text-align:start}
.meStage{position:relative;width:150px;height:150px;flex:none;border-radius:20px;border:3px solid var(--line);overflow:hidden;background:radial-gradient(circle at 50% 38%,#fffaf0 0,#ffe1a8 72%)}
.meStage::after{content:'';position:absolute;left:22%;right:22%;bottom:9%;height:9%;border-radius:50%;background:rgba(16,35,63,.16)}
#pvMe{width:100%;height:100%;display:block;position:relative;z-index:1;transition:opacity .4s;background:none;border-radius:0}
.meLoad{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;text-align:center;padding:8px;z-index:2}
.me.loading .meLoad{display:flex}.me.loading #pvMe{opacity:0}
.meLoad i{width:36px;height:36px;border-radius:50%;border:5px solid #fff;border-top-color:var(--line);animation:meSpin .9s linear infinite}
@keyframes meSpin{to{transform:rotate(360deg)}}
.meText small{display:block;font-weight:800;opacity:.75;font-size:15px}
.meText b{display:block;font-size:clamp(28px,7vw,38px);line-height:1.1}
.meTag{display:inline-block;margin-top:8px;background:var(--line);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800}
@media (max-width:420px){.meStage{width:118px;height:118px}}
</style>

<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="pills"><span class="pill" id="hearts"></span><span class="pill">⭐ <span id="score">0</span></span><span class="pill" id="lvlPill"></span></div>
    <div style="display:flex;gap:8px;pointer-events:none"><button class="iconbtn hidden" id="musicBtn" aria-label="Music">🎵</button><button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button></div>
  </div>
  <div id="energyWrap"><b id="energyLbl"></b><div class="bar"><div id="energy"></div></div></div>
  <div id="card"></div>
</div>
<div id="toast"></div>
<div id="touch" class="hidden">
  <div class="tgroup"><button class="tbtn" id="leftBtn" aria-label="Left">◀</button><button class="tbtn" id="rightBtn" aria-label="Right">▶</button></div>
  <div class="tgroup"><button class="tbtn" id="transformBtn" disabled></button><button class="tbtn" id="jumpBtn" aria-label="Jump">⤒</button></div>
</div>

<div class="screen" id="menu">
  <div class="panel">
    <div class="langs"><button id="langAr" class="on">عربي</button><button id="langEn">English</button></div>
    <h1 id="title"></h1>
    <p class="sub" id="tagline"></p>
    <div class="me loading" id="meCard"><div class="meStage"><canvas id="pvMe" width="320" height="320"></canvas><div class="meLoad"><i></i><span id="meLoadT"></span></div></div><div class="meText"><small id="meT"></small><b id="meName"></b><span class="meTag" id="meTag"></span></div></div>
    <h2 id="pickVeh"></h2>
    <div class="heroes vehs">
      <button class="hero" id="vehCar"><canvas id="pvCar" width="240" height="160"></canvas><span id="carName"></span></button>
      <button class="hero" id="vehScooter"><canvas id="pvScooter" width="240" height="160"></canvas><span id="scooterName"></span></button>
    </div>
    <div class="ages" id="ages"><span id="ageT"></span><button class="age" data-a="8"></button><button class="age" data-a="9"></button><button class="age" data-a="10"></button><button class="age" data-a="11"></button><button class="age" data-a="12"></button></div>
    <div class="levels" id="levels"></div>
    <div class="howto" id="howto"></div>
    <button class="go" id="playBtn"></button>
  </div>
</div>

<div class="screen hidden" id="pause">
  <div class="panel"><h2 id="pauseT"></h2><div class="row"><button class="go" id="resumeBtn" style="flex:1"></button></div><p></p><button class="ghost" id="quitBtn"></button></div>
</div>

<div class="screen hidden" id="end">
  <div class="panel">
    <canvas id="endImg" width="220" height="220"></canvas>
    <h2 id="endTitle"></h2>
    <div class="stars" id="endStars"></div>
    <div class="stats" id="endStats"></div>
    <div id="learnedT" style="font-weight:800"></div>
    <div class="learned" id="learned"></div>
    <div class="row"><button class="ghost" id="menuBtn"></button><button class="go" id="nextBtn" style="flex:1"></button></div>
  </div>
</div>

<script>
'use strict';
// ====================================================================================
//  Word Heroes · أبطال الكلمات — Arabic reading & spelling runner for ages 8–12
//  On foot: spell words by running through letter tiles. Full energy → transform into a
//  vehicle; in the vehicle answer grammar / meaning challenges by driving through the
//  right word. Three levels: Souq → Corniche → Desert.
// ====================================================================================
const $ = id => document.getElementById(id);
const SAVE_KEY = 'wordheroes.v1';
let save = { lang: 'ar', vehicle: 'car', age: 0, unlocked: 0, stars: [0, 0, 0] };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (_) {}
let lang = 'ar';
try { const sl = sessionStorage.getItem('abdullahworld.lang'); if (sl === 'en' || sl === 'ar') lang = sl; } catch (_) {}
function kidName() { return CHILD.name[lang] || CHILD.name.ar; }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }

// ---------- text ----------
const T = {
  ar: {
    age: 'كم عمرك؟', title: 'أبطال الكلمات', tagline: 'اركض، تهجَّ الكلمات، وتحوَّل إلى مركبة سريعة! تحدٍّ في القراءة والإملاء من ٨ إلى ١٢ سنة.',
    me: 'بطل اللعبة', meG: 'بطلة اللعبة', go: 'يلا يا', pickVeh: 'اختر مركبة التحوّل', car: 'سيارة سباق', scooter: 'سكوتر طائر',
    levels: [['سوق المباركية', 'سهل'], ['الكورنيش', 'متوسط'], ['الصحراء', 'صعب']],
    howto: '<b>تحرّك</b> الأسهم يمين ويسار أو اسحب<br><b>اقفز</b> السهم فوق أو المسافة أو زر ⤒<br><b>تحوّل</b> حرف T أو زر التحوّل عند امتلاء الطاقة',
    play: 'يلا نبدأ!', energy: 'الطاقة', transform: 'تحوّل!', spell: 'تهجَّ الكلمة', miss1: 'أكمل الحرف الناقص', miss2: 'أكمل الحرفين الناقصين', challenge: 'تحدّي القيادة', lvl: 'المرحلة',
    yes: 'صح!', no: 'حاول مرة ثانية', word: 'كلمة رائعة!', ready: 'الطاقة ممتلئة!\nاضغط تحوّل', transformed: 'تحوّل!', back: 'رجعت تركض', ouch: 'آخ!', finish: 'خط النهاية!',
    pause: 'استراحة', resume: 'كمّل', quit: 'القائمة', win: 'أحسنت يا {n}!', winG: 'أحسنتِ يا {n}!', over: 'انتهت القلوب', learned: 'الكلمات اللي تعلّمتها', accuracy: 'الدقة', next: 'المرحلة التالية', again: 'العب مرة ثانية', menu: 'القائمة', locked: 'مقفولة'
  },
  en: {
    age: 'How old are you?', title: 'Word Heroes', tagline: 'Run, spell Arabic words, and transform into a speedy vehicle! A reading and spelling challenge for ages 8–12.',
    me: 'Starring', meG: 'Starring', go: "Let's go,", pickVeh: 'Choose what you transform into', car: 'Race car', scooter: 'Flying scooter',
    levels: [['Mubarakiya Souq', 'Easy'], ['The Corniche', 'Medium'], ['The Desert', 'Hard']],
    howto: '<b>Move</b> Left/Right arrows or swipe<br><b>Jump</b> Up arrow, Space or ⤒<br><b>Transform</b> T or the transform button when energy is full',
    play: "Let's go!", energy: 'Energy', transform: 'Transform!', spell: 'Spell the word', miss1: 'Fill in the missing letter', miss2: 'Fill in the two missing letters', challenge: 'Driving challenge', lvl: 'Level',
    yes: 'Correct!', no: 'Try again', word: 'Great word!', ready: 'Energy full!\nPress transform', transformed: 'Transform!', back: 'Back on foot', ouch: 'Ouch!', finish: 'Finish line!',
    pause: 'Paused', resume: 'Resume', quit: 'Menu', win: 'Well done, {n}!', winG: 'Well done, {n}!', over: 'Out of hearts', learned: 'Words you learned', accuracy: 'Accuracy', next: 'Next level', again: 'Play again', menu: 'Menu', locked: 'Locked'
  }
};
const t = k => T[lang][k];

// ---------- learning content (Modern Standard Arabic) ----------
// Spelling: [word, emoji, clue]
const WORDS = [
  // Band 0 · ages 8–9: 4–5 letters, everyday words with ة and long vowels
  [['سفينة', '🚢', 'وسيلةُ نقلٍ بحريّةٌ كبيرةٌ تحملُ الرُّكّابَ عبرَ البحار'], ['حديقة', '🌳', 'مكانٌ فيه أشجارٌ وأزهارٌ نلعبُ فيه'], ['نخلة', '🌴', 'شجرةٌ تُعطينا التَّمر'], ['قارب', '🚤', 'سفينةٌ صغيرةٌ يصطادُ بها الصّيّادون'], ['مطبخ', '🍳', 'غرفةٌ نطبخُ فيها الطَّعام'], ['فراشة', '🦋', 'حشرةٌ لها أجنحةٌ ملوَّنة'], ['جزيرة', '🏝️', 'أرضٌ يُحيطُ بها الماءُ من كلِّ جانب'], ['مظلة', '☂️', 'نحملُها فوقَ رؤوسِنا لتحمينا من المطر'], ['مكتبة', '📚', 'مكانٌ فيه كتبٌ كثيرةٌ نستعيرُها ونقرؤها'], ['مسجد', '🕌', 'نُصلّي فيه مع الجماعة'], ['سمكة', '🐟', 'تعيشُ في الماءِ وتسبحُ بزعانفها'], ['ساعة', '⌚', 'نعرفُ بها الوقت']],
  // Band 1 · age 10: 4–6 letters, hamza words and less common vocabulary

// ---------- visuals ----------
let time = 0;
function smooth(x) { return x * x * (3 - 2 * x); }

  hero.position.set(P.x, P.y, 0);
  hero.rotation.y = Math.PI + (LANES[P.lane] - P.x) * -0.12;
  // transform blend: robot shrinks/spins, vehicle grows

  u.bot.visible = tf < 0.98; u.veh.visible = tf > 0.02;
  u.bot.scale.setScalar(Math.max(0.001, 1 - tf)); u.bot.rotation.y = spin;
  u.veh.scale.setScalar(Math.max(0.001, tf)); u.veh.rotation.y = -spin;
  if (u.mixer) u.mixer.update(P.mode === 'foot' ? dt * (P.y > 0.05 ? 0.4 : speed / 9) : 0);

    u.arms[0].rotation.x = air ? -2.4 : -s * 0.8; u.arms[1].rotation.x = air ? -2.4 : s * 0.8;

  hero.visible = !(P.invuln > 0 && Math.floor(time * 12) % 2 === 0);

function band() { const a = save.age || CHILD.age || 8; return a <= 9 ? 0 : a === 10 ? 1 : 2; }
// how much of each word the child fills in: ages 8–9 → one missing letter, age 10 → two, ages 11–12 → the whole word
const TRICKY = 'ةءأإؤئىآثذظضطصغقخحجشز';

  const c = new THREE.PerspectiveCamera(35, cv.width / cv.height, 0.1, 50); c.position.set(0, which === 'veh' ? 2.6 : 1.9, which === 'veh' ? 7 : 6.4); c.lookAt(0, which === 'veh' ? 0.8 : 1.45, 0);
  r.setClearColor(0x000000, 0); r.clear(); r.render(s, c);
}
function ariaL() { const ar = lang !== 'en'; const L = { pauseBtn: ['إيقاف مؤقت', 'Pause'], leftBtn: ['يسار', 'Left'], rightBtn: ['يمين', 'Right'], jumpBtn: ['قفز', 'Jump'] }; for (const id in L) { const e = document.getElementById(id); if (e) e.setAttribute('aria-label', L[id][ar ? 0 : 1]); } }
function drawMenu() {
  ariaL(); heroCard();
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('langAr').classList.toggle('on', lang === 'ar'); $('langEn').classList.toggle('on', lang === 'en');
  $('title').textContent = t('title'); $('tagline').textContent = t('tagline'); $('meT').textContent = CHILD.gender === 'girl' ? t('meG') : t('me'); $('meName').textContent = kidName();
  $('pickVeh').textContent = t('pickVeh'); $('carName').textContent = t('car'); $('scooterName').textContent = t('scooter');
  $('vehCar').classList.toggle('on', save.vehicle === 'car'); $('vehScooter').classList.toggle('on', save.vehicle === 'scooter');
  
  $('levels').innerHTML = t('levels').map(([n, d], i) => `<button class="lvl${i === selLevel ? ' on' : ''}" data-l="${i}" ${i > save.unlocked ? 'disabled' : ''}>${n}<small>${i > save.unlocked ? '🔒 ' + t('locked') : d}</small><span class="st">${'★'.repeat(save.stars[i] || 0)}${'☆'.repeat(3 - (save.stars[i] || 0))}</span></button>`).join('');
  $('levels').querySelectorAll('.lvl').forEach(b => b.onclick = () => { selLevel = +b.dataset.l; drawMenu(); });
  drawAges(); $('howto').innerHTML = t('howto'); $('playBtn').textContent = t('play');
  $('pauseT').textContent = t('pause'); $('resumeBtn').textContent = t('resume'); $('quitBtn').textContent = t('quit');
  $('energyLbl').textContent = t('energy'); $('transformBtn').textContent = t('transform');
}

// ---------- hero card on the start screen: the child's real 3D character, turning slowly ----------
let cardR = null, cardS = null, cardC = null, cardArt = null, cardMix = null;
function heroCard() {
  const girl = CHILD.gender === 'girl', en = typeof lang !== 'undefined' && lang === 'en';
  $('meLoadT').textContent = en ? 'Getting your hero ready…' : girl ? 'نجهّز بطلتك…' : 'نجهّز بطلك…';
  const age = (typeof save !== 'undefined' && save.age) || CHILD.age || 0, ad = String(age).split('').map(d => '٠١٢٣٤٥٦٧٨٩'[d]).join('');
  $('meTag').textContent = !age ? '' : en ? '🎂 Age ' + age : '🎂 ' + ad + (age <= 10 ? ' سنوات' : ' سنة'); $('meTag').style.display = age ? '' : 'none';
  if (!GLB.hero) return;
  if (!cardR) {
    try { cardR = new THREE.WebGLRenderer({ canvas: $('pvMe'), antialias: true, alpha: true }); } catch (_) { return; }
    cardS = new THREE.Scene(); cardS.add(new THREE.HemisphereLight(0xffffff, 0xb59a7a, 1.05));
    const k = new THREE.DirectionalLight(0xffffff, 0.75); k.position.set(2, 4, 5); cardS.add(k);
    const rim = new THREE.DirectionalLight(0xffffff, 0.35); rim.position.set(-3, 3, -4); cardS.add(rim);
    cardC = new THREE.PerspectiveCamera(28, 1, 0.05, 50);
  }
  if (!cardArt) {
    const art = glb('hero', 2, 'max'); if (!art) return;
    const clip = art.userData.clips && art.userData.clips[0];
    if (clip) { cardMix = new THREE.AnimationMixer(art.userData.model); cardMix.clipAction(clip).play(); cardMix.update(0.2); }
    const piv = new THREE.Group(); piv.add(art); cardS.add(piv);
    const b = boxOf(art), c = new THREE.Vector3(), z = new THREE.Vector3(); b.getCenter(c); b.getSize(z);
    art.position.sub(new THREE.Vector3(c.x, c.y, c.z));
    const h = Math.max(z.x, z.y, z.z); cardC.position.set(0, h * 0.12, h * 2.25); cardC.lookAt(0, 0, 0);
    cardArt = piv;
  }
  $('meCard').classList.remove('loading');
}
function heroCardTick(dt) {
  if (!cardArt || !cardR || state !== 'menu') return;
  cardArt.rotation.y += dt * 0.6; if (cardMix) cardMix.update(dt * 0.7);
  cardR.render(cardS, cardC);
}
let selLevel = Math.min(save.unlocked, 2);
$('vehCar').onclick = () => { save.vehicle = 'car'; persist(); drawMenu(); drawPreviews(); };
$('vehScooter').onclick = () => { save.vehicle = 'scooter'; persist(); drawMenu(); drawPreviews(); };
function drawPreviews() { heroCard(); drawPreview($('pvCar'), CHILD.gender, 'veh', 'car'); drawPreview($('pvScooter'), CHILD.gender, 'veh', 'scooter'); }
$('langAr').onclick = () => { lang = 'ar'; try { sessionStorage.setItem('abdullahworld.lang', 'ar'); } catch (_) {} drawMenu(); };
$('langEn').onclick = () => { lang = 'en'; try { sessionStorage.setItem('abdullahworld.lang', 'en'); } catch (_) {} drawMenu(); };
$('playBtn').onclick = () => { if (save.age) startLevel(selLevel); };

// ---------- loop ----------
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
buildWorld(0); camera.position.set(0, 4.3, 7.6);
hero = makeHero(CHILD.gender, save.vehicle); scene.add(hero);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  heroCardTick(dt);
  if (state === 'menu') { // idle: gentle run behind the menu
    const dz = 6 * dt; roadTex.offset.y -= dz / 300 * 18; for (const o of scenery) o.position.z += dz; for (let i = scenery.length - 1; i >= 0; i--) if (scenery[i].position.z > 14) { world.remove(scenery[i]); scenery.splice(i, 1); }
    sceneryAcc += dz; while (sceneryAcc >= 9) { sceneryAcc -= 9; spawnScenery(-170 + sceneryAcc); }
    P.x = 0; speed = 6;
  }
  update(dt); visuals(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
drawPreviews();
loadArt(
  { hero: CHILD.runModel || 'child-run.gltf.json', shop: 'shop.gltf.json', palm: 'palm.gltf.json', stall: 'stall.gltf.json', camel: 'camel.gltf.json', tent: 'tent.gltf.json', trafficCar: 'traffic-car.gltf.json', raceCar: 'race-car.gltf.json', scooter: 'scooter.gltf.json', barrier: 'barrier.gltf.json' },
  { bg0: 'bg-wh-souq.jpg', bg1: 'bg-wh-corniche.jpg', bg2: 'bg-wh-desert.jpg', towers: 'kuwait-towers.png' }
).then(() => { if (state === 'menu') { buildWorld(0); if (hero) scene.remove(hero); hero = makeHero(CHILD.gender, save.vehicle); scene.add(hero); } drawPreviews(); window.__artReady = true; });
document.fonts && document.fonts.ready.then(() => { for (const k in texCache) delete texCache[k]; });
drawMenu();
requestAnimationFrame(frame);
window.__wh = { get state() { return state; }, P, pauseGame, resumeGame, startLevel, update, visuals, doTransform, move, jump, get objs() { return objs; }, get word() { return word; }, get chal() { return chal; }, get stats() { return { score, hearts, energy, wordsDone, chalDone, tries, correct, needGate, carChalLeft, finishSpawned }; } };
