<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Hop</title>
<meta name="theme-color" content="#4fb3ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed 3D canvas, floating pill HUD, chunky storybook cards for menus (single bright look) */
:root{
  --sky:#8fd3ff; --ink:#1d2a4a; --sun:#ffc93c; --leaf:#3fb85c; --coral:#ff5f6d; --teal:#18b5a6; --paper:#fffaf0; --mist:rgba(255,255,255,.85);
  --font:"Baloo Bhaijaan 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2}
.row{display:flex;gap:7px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:2px 11px 2px 7px;font-weight:800;font-size:19px;line-height:1.3;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:22px;height:22px;flex:none}
.pill .of{font-size:14px;opacity:.6}
.pill.num{direction:ltr}
.hearts{padding:3px 9px;gap:2px}
.hearts svg{width:20px;height:20px}
.hearts .lost path{fill:none;stroke:var(--ink);stroke-width:2;opacity:.35}
.time{margin-inline-start:auto;padding:2px 11px}
.homeBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.homeBtn svg{width:20px;height:20px}
.letters{display:flex;flex-wrap:wrap;gap:3px}
.chip{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:14px;line-height:1;border:2px dashed rgba(29,42,74,.45);background:rgba(255,255,255,.55);color:rgba(29,42,74,.45)}
.chip.got{border:2px solid var(--ink);color:#fff;box-shadow:0 2px 0 var(--ink);-webkit-text-stroke:.6px var(--ink)}
.joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(29,42,74,.45);z-index:3;pointer-events:none;transition:opacity .2s}
.joy.idle{opacity:.55}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.jump{position:fixed;right:calc(max(18px,env(safe-area-inset-right,0px)) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:92px;height:92px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);color:var(--ink);font-family:var(--font);font-weight:800;font-size:20px;box-shadow:0 5px 0 var(--ink);z-index:3;touch-action:none;padding:0}
.jump.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 80px) calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;background:linear-gradient(180deg,rgba(143,211,255,.1),rgba(29,42,74,.38))}
.card{width:min(430px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:18px 20px 22px;text-align:center;display:grid;gap:12px;position:relative}
.hero{display:block;height:140px;width:auto;margin:-96px auto -8px;filter:drop-shadow(0 6px 0 rgba(29,42,74,.22))}
.card h1{font-weight:800;font-size:clamp(42px,12vw,58px);line-height:1.05;margin:0;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-wrap:balance}
.card h2{font-weight:800;font-size:32px;margin:0;line-height:1.1;text-wrap:balance}
.card p{margin:0;font-size:16px;line-height:1.5;font-weight:500}
.lang{position:absolute;top:12px;inset-inline-end:12px;display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;z-index:1}
.lang button{border:0;background:transparent;font-family:var(--font);font-weight:800;font-size:14px;padding:3px 11px;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:7px 4px 6px;font-family:var(--font);color:var(--ink);cursor:pointer;display:grid;gap:0;min-width:0}
.lvl .n{font-weight:800;font-size:20px;line-height:1.15}
.lvl .nm{font-size:13px;font-weight:700;line-height:1.2}
.lvl .ck{font-size:12px;font-weight:800;color:var(--leaf);min-height:16px}
.lvl[aria-pressed="true"]{background:var(--sun);box-shadow:0 4px 0 var(--ink)}
.kids{display:flex;align-items:center;gap:12px;text-align:start;background:rgba(63,184,92,.12);border-radius:16px;padding:9px 12px;cursor:pointer;border:2px solid transparent}
.kids input{position:absolute;opacity:0;pointer-events:none}
.sw{flex:none;width:46px;height:28px;border-radius:999px;background:#c9d2e3;border:2px solid var(--ink);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:inset-inline-start .2s}
.kids input:checked + .sw{background:var(--leaf)}
.kids input:checked + .sw::after{inset-inline-start:20px}
.kids input:focus-visible + .sw{outline:3px dashed var(--ink);outline-offset:3px}
.kids b{display:block;font-size:16px;line-height:1.2}
.kids small{display:block;font-size:13px;font-weight:500;opacity:.75;line-height:1.3}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;text-align:start;font-size:14px;font-weight:500;background:rgba(143,211,255,.25);border-radius:16px;padding:9px 14px;line-height:1.4}
.keys b{font-weight:800}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go{font-family:var(--font);font-weight:800;font-size:24px;line-height:1.2;border:3px solid var(--ink);background:var(--leaf);color:#fff;border-radius:18px;padding:9px 20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;flex:1 1 auto}
.go.alt{background:#fff;color:var(--ink);-webkit-text-stroke:0;font-size:20px;flex:0 1 auto}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;font-size:13px;z-index:2;pointer-events:none;white-space:nowrap;transition:opacity .6s;max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis}
body.touch .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);font-weight:800;font-size:26px;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);z-index:2;pointer-events:none;transition:opacity .4s, transform .4s;white-space:pre-line;text-align:center;width:max-content;max-width:calc(100vw - 32px);line-height:1.25}
.toast.off{opacity:0;transform:translateX(-50%) translateY(-10px)}
.pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(1);display:grid;place-items:center;gap:0;z-index:2;pointer-events:none;transition:opacity .35s, transform .35s}
.pop.off{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.pop .big{width:120px;height:120px;border-radius:30px;display:grid;place-items:center;font-weight:800;font-size:86px;line-height:1;color:#fff;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.pop .nm{margin-top:12px;font-weight:800;font-size:24px;background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:0 14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.toast,.hint,.joy,.pop,.sw,.sw::after{transition:none}}
.worldBtn{position:absolute;top:12px;inset-inline-start:12px;display:flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:2px 10px 2px 6px;font-family:var(--font,inherit);font-weight:800;font-size:13px;color:var(--ink);text-decoration:none;z-index:1}
.worldBtn svg{width:18px;height:18px;flex:none}
</style>

<canvas id="game" tabindex="0" aria-label="Star Hop"></canvas>

<div class="hud" id="hud" hidden>
  <div class="row">
    <button class="homeBtn" id="homeBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M6 10v9h4.5v-5h3v5H18v-9" fill="none" stroke="#1d2a4a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="pill num"><svg viewBox="0 0 24 24"><polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#ffc93c" stroke="#1d2a4a" stroke-width="1.8" stroke-linejoin="round"/></svg><span id="starCount">0</span><span class="of">/ <span id="starTotal">0</span></span></div>
    <div class="pill hearts" id="hearts"></div>
    <div class="pill time num" id="time">0:00</div>
  </div>
  <div class="letters" id="letterStrip"></div>
</div>

<div class="toast off" id="toast"></div>
<div class="pop off" id="pop"><div class="big" id="popBig">ب</div><div class="nm" id="popName">باء</div></div>
<div class="hint" id="hint" hidden></div>

<div class="joy idle" id="joy" hidden><div class="knob" id="knob"></div></div>
<button class="jump" id="jumpBtn" hidden aria-label="Jump">JUMP</button>

<div class="overlay" id="menu">
  <div class="card">
    <a class="worldBtn" id="worldBtn" href="index.html" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#8fd3ff" stroke="#1d2a4a" stroke-width="2"/><path d="M7 10c2-1 3 1 5 0s2-3 4-2M8 15c2 1 4-1 6 0" fill="none" stroke="#3fb85c" stroke-width="2.4" stroke-linecap="round"/></svg><span id="worldLbl"></span></a>
    <div class="lang" role="group" aria-label="Language"><button id="langEn" aria-pressed="true">English</button><button id="langAr" aria-pressed="false">عربي</button></div>
    <img class="hero" id="heroImg" alt="">
    <h1 data-t="title">Star Hop</h1>
    <p data-t="intro"></p>
    <div class="levels" id="levelBtns"></div>
    <label class="kids" for="kidsBox"><input type="checkbox" id="kidsBox"><span class="sw"></span><span><b data-t="kids"></b><small data-t="kidsSub"></small></span></label>
    <div class="keys" id="keys"></div>
    <button class="go" id="playBtn" data-t="play">Play</button>
  </div>
</div>

<div class="overlay" id="endCard" hidden>
  <div class="card">
    <img class="hero" id="endImg" alt="">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div class="stats" id="endStats"></div>
    <div class="btns"><button class="go alt" id="menuBtn" data-t="menu"></button><button class="go" id="nextBtn"></button></div>
  </div>
</div>

  } else {
    const ex = p.hx + PR, ez = p.hz + PR, dx = pos.x - p.x, dz = pos.z - p.z;
    if (Math.abs(dx) < ex && Math.abs(dz) < ez) {

function updatePlatforms() {
  for (const p of plats) if (p.move) {
    const m = p.move, s = (Math.sin(time * m.speed * moverFactor + m.phase) + 1) / 2, v = m.a + (m.b - m.a) * s;
    const ox = p.x, oy = p.top, oz = p.z;

    p.dx = p.x - ox; p.dy = p.top - oy; p.dz = p.z - oz;
    p.group.position.set(p.x, p.top, p.z);
  }
}

function updatePlayer(dt) {
  const pos = P.pos, vel = P.vel;
  if (P.ground && P.ground.move) { pos.x += P.ground.dx; pos.y += P.ground.dy; pos.z += P.ground.dz; }
  let ix = 0, iy = 0;
  if (keys['w'] || keys['arrowup']) iy += 1;
  if (keys['s'] || keys['arrowdown']) iy -= 1;

  if (keys['d'] || keys['arrowright']) ix += 1;

  if (keys['e']) { camYaw -= 2 * dt; lastDrag = time; }

  P.fwd = iy > 0.45 && Math.abs(ix) < 0.6 * iy;

  if (!jumpHeld && vel.y > 0 && !P.jumpCut) { vel.y *= 0.5; P.jumpCut = true; }
  vel.y = Math.max(-28, vel.y - G * dt);
  const prevY = pos.y;
  pos.x += vel.x * dt; pos.y += vel.y * dt; pos.z += vel.z * dt;

  if (vel.y > 0 && !(P.netFly > 0)) for (const p of plats) { const bottom = p.top - p.depth; if (prevY + PH <= bottom + 0.05 && pos.y + PH > bottom && insideTop(p, pos.x, pos.z, 0)) { pos.y = bottom - PH; vel.y = 0; } }

  const wasGround = P.onGround;
  if (land) {
    if (land.net) { pos.y = land.top; netBounce(); }

      pos.y = land.top; vel.y = 21.5; P.onGround = false; P.ground = null; P.jumpCut = true;
      spring.userData.anim = 1; sfx.spring(); toast(vt('boing', 'abd-wow', 'now')); P.squash = -0.3;
    } else {
      pos.y = land.top; vel.y = 0; P.onGround = true; P.ground = land; P.netFly = 0;
      if (!wasGround) { P.squash = 0.22; sfx.land(); }
      if (!land.move && !land.tree) P.safe = { x: land.x, z: land.z + (land === plats[0] && levelIdx !== 2 ? 3 : 0), top: land.top };
    }
  } else { P.onGround = false; P.ground = null; }
  // step up small ledges (bridges, gentle slopes) without needing a jump
  if (vel.y <= 0 && (P.onGround || wasGround)) for (const p of plats) {
    if (p.net || p.bounce || p.tree) continue;
    const dh = p.top - pos.y;
    if (dh > 0 && dh <= 0.4 && insideTop(p, pos.x, pos.z, PR + 0.02)) { pos.y = p.top; vel.y = 0; P.onGround = true; P.ground = p; }
  }
  if (springPlat && vel.y <= 0 && (P.onGround || wasGround) && insideTop(springPlat, pos.x, pos.z, PR * 0.6)) {
    const dh = springPlat.top - pos.y;
    if (dh > -0.05 && dh < 1.0) { pos.y = springPlat.top; vel.y = 21.5; P.onGround = false; P.ground = null; P.jumpCut = true; spring.userData.anim = 1; sfx.spring(); toast(vt('boing', 'abd-wow', 'now')); P.squash = -0.3; }
  }
  if (!(P.netFly > 0)) for (const p of plats) if (p !== springPlat) pushOut(p);

  if (pos.y < -6) {
    sfx.splash(); burst(new V3(pos.x, -3.8, pos.z), 12, 4); toast(vt('splash', 'hop-splash', 'now'));
    if (!save.kids) { hearts--; drawHearts(); if (hearts <= 0) { endLevel(false); return; } }
    respawn();
  }
  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    const ep = e.mesh.position, d = Math.hypot(pos.x - ep.x, pos.z - ep.z);
    if (d < 0.85 && pos.y < ep.y + 0.55 && pos.y + PH > ep.y - 0.4) {
      if (vel.y < 0 && pos.y > ep.y + 0.05) { e.alive = false; e.dieT = 0; vel.y = 13; P.jumpCut = true; P.onGround = false; sfx.stomp(); burst(ep.clone(), 10, 5); toast(vt('squish', 'hop-squish', 'now')); }
      else hurt(ep.x, ep.z);
    }
  }
  // items
  const cx = pos.x, cyy = pos.y + 0.85, cz = pos.z;
  for (const it of items) {
    if (it.taken) continue;
    const p = it.g.position;
    if ((p.x - cx) ** 2 + (p.y - cyy) ** 2 + (p.z - cz) ** 2 < 1.25) {
      it.taken = true; it.g.visible = false; P.cheer = 0.6;
      burst(p.clone(), 14, 6);
      if (it.type === 'S') { stars++; $('starCount').textContent = stars; sfx.star(); }
      else {
        const l = levelLetters[it.letter]; l.got = true; lettersGot++;
        drawLetterStrip(); popLetter(l); sfx.letter(); sayLetter(l.ch, l.name);

    }
  }
  // flags
  for (const f of flags) {
    if (!f.on && Math.hypot(pos.x - f.x, pos.z - f.z) < 1.5 && Math.abs(pos.y - f.top) < 1.6) {
      f.on = true; f.cloth.material = flagOn; P.check = { x: f.x - 0.8, z: f.z - 0.8, top: f.top }; sfx.flag(); toast(vt('check', 'hop-checkpoint', 'now')); burst(new V3(f.x, f.top + 2.5, f.z), 10, 4);
    }
  }
  // goal
  if (goal) {
    const gp = goal.g.position, d = Math.hypot(pos.x - gp.x, pos.z - gp.z);

}
function openGoal() {
  if (!goal) return;
  goal.open = true; goal.g.userData.body.material = starMat;
  burst(goal.g.position.clone(), 24, 7);
  setTimeout(() => { if (state === 'play') toast(vt('allLetters', 'hop-all-letters') + '\n' + t('goStar'), 2.4); sfx.big(); }, 700);
}

// ---------- Mahdi animation (blended, smooth) ----------
function animateBoy(dt) {
  const u = boy.userData, hs = Math.hypot(P.vel.x, P.vel.z);
  P.cheer = Math.max(0, P.cheer - dt); P.hurtT = Math.max(0, P.hurtT - dt);
  P.idle = (P.onGround && hs < 0.5 && state === 'play') ? P.idle + dt : (state === 'menu' ? P.idle + dt : 0);
  const walkTarget = P.onGround ? Math.min(1, hs / SPEED) : 0;
  P.walk += (walkTarget - P.walk) * Math.min(1, 10 * dt);
  const k = P.walk;
  if (P.onGround) P.phase += dt * (hs * 1.8 + 1.5 * k);

  const tg = {
    hL: -s * 0.8 * k, hR: s * 0.8 * k,
    kL: 0.06 + Math.max(0, c) * 1.15 * k, kR: 0.06 + Math.max(0, -c) * 1.15 * k,
    sLx: s * 0.7 * k, sRx: -s * 0.7 * k, sLz: -0.1, sRz: 0.1,
    eLx: -0.15 - 0.55 * k, eRx: -0.15 - 0.55 * k, eLz: 0, eRz: 0,
    by: Math.abs(c) * 0.07 * k + Math.sin(time * 2.2) * 0.008 * (1 - k), bx: 0.12 * k, bz: s * 0.035 * k, hy: 0, hx: -0.05 * k

    Object.assign(tg, { bx: -0.3, sLz: -1.2, sRz: 1.2, sLx: -0.4, sRx: -0.4, hL: -0.5, hR: 0.2, kL: 0.6, kR: 0.4, hx: 0.2 });
  } else if (!P.onGround && state === 'play') {
    const up = P.vel.y > 0;
    Object.assign(tg, up
      ? { hL: -1.0, kL: 1.3, hR: 0.35, kR: 0.35, sLx: -2.7, sLz: -0.15, sRx: 0.7, sRz: 0.35, eLx: -0.2, eRx: -0.6, bx: 0.08, hx: -0.15 }
      : { hL: -0.45, kL: 0.7, hR: 0.15, kR: 0.5, sLx: -0.3, sRx: -0.3, sLz: -1.3, sRz: 1.3, eLx: -0.3, eRx: -0.3, bx: 0.02, hx: 0.05 });
  } else if (P.cheer > 0 || state === 'win') {
    const bounce = Math.abs(Math.sin(time * 10)) * 0.08;
    Object.assign(tg, { sLz: -2.75, sRz: 2.75, sLx: 0, sRx: 0, eLx: 0, eRx: 0, eLz: -0.3 + Math.sin(time * 14) * 0.2, eRz: 0.3 - Math.sin(time * 14) * 0.2, by: bounce, hx: -0.2 });
  } else if (k < 0.15 && P.idle > 3 && (P.idle % 7) < 2.4) {

  }

  u.L.hip.rotation.x = J.hL; u.R.hip.rotation.x = J.hR; u.L.knee.rotation.x = J.kL; u.R.knee.rotation.x = J.kR;
  u.AL.sh.rotation.set(J.sLx, 0, J.sLz); u.AR.sh.rotation.set(J.sRx, 0, J.sRz);
  u.AL.el.rotation.set(J.eLx, 0, J.eLz); u.AR.el.rotation.set(J.eRx, 0, J.eRz);
  u.body.position.y = J.by; u.body.rotation.set(J.bx, 0, J.bz);
  u.head.rotation.set(J.hx, J.hy + (state === 'menu' ? Math.sin(time * 0.8) * 0.3 : 0), 0);
  P.squash += (0 - P.squash) * Math.min(1, 12 * dt);
  const sc = 0.8;
  boy.scale.set(sc * (1 + P.squash * 0.35), sc * (1 - P.squash * 0.8), sc * (1 + P.squash * 0.35));
  boy.position.copy(P.pos);
  boy.rotation.y = state === 'menu' ? lerpAngle(boy.rotation.y, Math.atan2(camera.position.x - P.pos.x, camera.position.z - P.pos.z), Math.min(1, 3 * dt)) : P.facing;
  boy.visible = P.invuln > 0 && state === 'play' ? (Math.floor(time * 14) % 2 === 0) : true;
  { const fx = Math.sin(boy.rotation.y), fz = Math.cos(boy.rotation.y), cxv = camera.position.x - P.pos.x, czv = camera.position.z - P.pos.z;

  let gTop = null;

  if (gTop === null) gTop = -3.97;
  const h = P.pos.y - gTop;
  blob.position.set(P.pos.x, gTop + 0.03, P.pos.z); blob.scale.setScalar(Math.max(0.35, 1 - h * 0.07)); blob.material.opacity = Math.max(0.08, 0.32 - h * 0.02);
}

function update(dt) {
  updatePlatforms();
  if (state === 'play') {
    elapsed += dt; updatePlayer(dt); $('time').textContent = fmt(elapsed);
    if (winTimer > 0) { winTimer -= dt; if (winTimer <= 0 && state === 'play') endLevel(true); }
  }
  animateBoy(dt);
  for (const e of enemies) {
    const m = e.mesh;
    if (e.alive) {
      e.ang += e.speed * moverFactor * dt;
      const x = e.p.x + Math.cos(e.ang) * e.R, z = e.p.z + Math.sin(e.ang) * e.R;
      m.position.set(x, e.p.top + 0.42 + Math.abs(Math.sin(time * 8 + e.ang)) * 0.06, z);
      m.rotation.y = Math.atan2(-Math.sin(e.ang) * Math.sign(e.speed), Math.cos(e.ang) * Math.sign(e.speed));

      if (e.dieT > 0.45) m.visible = false;
    }
  }
  for (const it of items) if (!it.taken) {
    it.g.position.y = it.base + Math.sin(time * 2.4 + it.phase) * 0.15;
    if (it.type === 'S') it.g.rotation.y = time * 2 + it.phase;
    else { it.g.quaternion.copy(camera.quaternion); it.g.rotateZ(Math.sin(time * 2 + it.phase) * 0.12); }
  }
  if (goal && goal.g.visible) { goal.g.rotation.y = time * 1.3; goal.g.position.y = goal.p.top + 2 + Math.sin(time * 2) * 0.2; goal.ring.scale.setScalar(goal.open ? 1 + Math.sin(time * 4) * 0.08 : 1); }
  for (const f of flags) { f.cloth.rotation.y = Math.sin(time * 3 + f.x) * 0.25; f.rise += ((f.on ? 1 : 0) - f.rise) * Math.min(1, 3 * dt); f.cloth.position.y = 0.9 + f.rise * 1.8; }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt; q.v.y -= 14 * dt; q.m.position.addScaledVector(q.v, dt); q.m.rotation.x += dt * 6; q.m.rotation.y += dt * 4;
    q.m.scale.setScalar(Math.max(0.01, q.life)); if (q.life <= 0) { scene.remove(q.m); parts.splice(i, 1); }
  }
  if (net && net.dip > 0) { net.dip = Math.max(0, net.dip - dt * 2.5); net.mesh.position.y = net.top - Math.sin(net.dip * Math.PI) * 0.35; }
  if (spring) {
    const su = spring.userData; if (su.anim > 0) su.anim = Math.max(0, su.anim - dt * 3);
    const comp = Math.sin(su.anim * Math.PI) * 0.6; su.coil.scale.y = 1 - comp * 0.6; su.pad.position.y = 0.6 - comp * 0.25; su.dot.position.y = 0.71 - comp * 0.25;
  }
  if (dhow) {
    const [dcx, dcz, dr] = dhow.userData.path, tt = time * 0.035;
    dhow.position.set(dcx + Math.cos(tt) * dr, -3.75 + Math.sin(time * 1.4) * 0.12, dcz + Math.sin(tt) * dr);
    dhow.rotation.set(Math.sin(time * 1.1) * 0.05, Math.atan2(-Math.cos(tt), -Math.sin(tt)), 0);
  }
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 170) c.position.x = -170; }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.add('off'); }
  if (popT > 0) { popT -= dt; if (popT <= 0) $('pop').classList.add('off'); }

  let target;
  if (state === 'menu') {
    camYaw += dt * 0.15; camDist += (7 - camDist) * Math.min(1, 2 * dt); camPitch += (0.25 - camPitch) * Math.min(1, 2 * dt);
    target = new V3(P.pos.x, P.pos.y + 1.2, P.pos.z);
  } else {
    target = new V3(P.pos.x, P.pos.y + 1.3, P.pos.z); camDist += (9.5 - camDist) * Math.min(1, 3 * dt);
    const hs = Math.hypot(P.vel.x, P.vel.z);
    if (state === 'play' && camDrag.id === null && time - lastDrag > 1.5 && hs > 3 && P.fwd) { const d = angDiff(camYaw, P.facing + Math.PI); if (Math.abs(d) < 2.0) camYaw += d * Math.min(1, 0.9 * dt); }
  }
  const kx = 1 - Math.exp(-9 * dt), ky = 1 - Math.exp(-4 * dt);
  camFocus.x += (target.x - camFocus.x) * kx; camFocus.z += (target.z - camFocus.z) * kx; camFocus.y += (target.y - camFocus.y) * ky;
  camera.position.set(camFocus.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist, camFocus.y + Math.sin(camPitch) * camDist, camFocus.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist);
  camera.lookAt(camFocus);
  sky.position.copy(camera.position);
  sun.position.set(camera.position.x + 160, camera.position.y + 150, camera.position.z - 260); sun.lookAt(camera.position);
  light.position.set(camFocus.x + 18, camFocus.y + 34, camFocus.z + 12); light.target.position.copy(camFocus);
}

// ================= boot =================
applyLang();
loadLevel(selLevel); placeIdle(); camFocus.set(P.pos.x, P.pos.y + 1.2, P.pos.z);
// rebuild letter tiles once the Arabic/Latin font has arrived so canvases use it
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('800 170px "Baloo Bhaijaan 2"', 'أبت'), document.fonts.load('800 170px "Baloo Bhaijaan 2"', 'ABC')]).then(() => {
    for (const k in letterTexCache) delete letterTexCache[k];
    if (state === 'menu') { loadLevel(selLevel); placeIdle(); }
  }).catch(() => {});
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  update(dt); renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>

<style>.musBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);inset-inline-start:14px;z-index:60;width:44px;height:44px;border-radius:50%;border:2px solid #1d2a4a;background:#fff;box-shadow:0 3px 0 #1d2a4a;display:grid;place-items:center;cursor:pointer;padding:0}.musBtn svg{width:22px;height:22px}.musBtn.inhud{position:static;width:38px;height:38px;pointer-events:auto;flex:none}.musBtn.top{position:static;width:36px;height:36px;box-shadow:0 2px 0 #1d2a4a;margin-inline-start:auto}</style>
<script>/* background music + mute button */(function(){var KEY='raneen.music',on=true;try{on=localStorage.getItem(KEY)!=='off'}catch(e){}
var a=new Audio('audio/music/music-hop.mp3');a.loop=true;a.volume=0.22;a.preload='auto';var started=false;
function play(){if(on&&!document.hidden){a.play().then(function(){started=true}).catch(function(){})}}
var ON='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#ffc93c" stroke="#1d2a4a" stroke-width="2" stroke-linejoin="round"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1d2a4a" stroke-width="2" stroke-linecap="round"/></svg>';
var OFF='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#dfe4ee" stroke="#1d2a4a" stroke-width="2" stroke-linejoin="round"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#ff5f6d" stroke-width="2.4" stroke-linecap="round"/></svg>';
var b=document.createElement('button');b.className='musBtn';b.type='button';
function paint(){b.innerHTML=on?ON:OFF;b.setAttribute('aria-label',on?'Music on':'Music off');b.setAttribute('aria-pressed',on?'true':'false')}paint();
['pointerdown','touchstart','mousedown'].forEach(function(t){b.addEventListener(t,function(e){e.stopPropagation()})});
b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();on=!on;try{localStorage.setItem(KEY,on?'on':'off')}catch(_){}if(on)play();else a.pause();paint();b.blur()});
function first(){play();if(started){document.removeEventListener('pointerdown',first,true);document.removeEventListener('keydown',first,true)}}
document.addEventListener('pointerdown',first,true);document.addEventListener('keydown',first,true);
document.addEventListener('visibilitychange',function(){if(document.hidden)a.pause();else if(started)play()});
window.addEventListener('pagehide',function(){a.pause()});
function place(){var hud=document.getElementById('hud'),top=document.querySelector('.top .lang');
 if(hud&&!hud.hidden){var row=hud.querySelector('.row'),hb=document.getElementById('homeBtn');if(row&&b.parentNode!==row){b.className='musBtn inhud';hb&&hb.nextSibling?row.insertBefore(b,hb.nextSibling):row.appendChild(b)}}
 else if(top){if(b.parentNode!==top.parentNode){b.className='musBtn top';top.parentNode.insertBefore(b,top)}}
 else if(b.parentNode!==document.body){b.className='musBtn';document.body.appendChild(b)}}
place();var hud=document.getElementById('hud');if(hud)new MutationObserver(place).observe(hud,{attributes:true,attributeFilter:['hidden']});
})();</script>
</body>
</html>
