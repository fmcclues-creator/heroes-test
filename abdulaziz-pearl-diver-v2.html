<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pearl Diver · غوّاص اللؤلؤ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<style>
:root{
  --ink:#1b2440; --cream:#fff8ec; --sky:#4fb3ff; --sun:#ffc93c; --mint:#2fd39a; --berry:#ff5f8f; --violet:#8a63ff; --line:#1b2440; --sea:#17a6c9;
  --font:'Baloo Bhaijaan 2',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#4fb3ff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font-family:var(--font);color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:3px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .hrt{color:var(--berry)}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;display:grid;place-items:center;padding:0}
#goal{margin:8px auto 0;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:16px;padding:4px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #0006}
#goal .dots{display:flex;gap:4px;flex:none}
#goal .dots i{width:11px;height:11px;border-radius:50%;background:#ffffff40;border:2px solid #fff}
#goal .dots i.on{background:var(--sun)}#goal .dots i.now{background:#fff}
#goal span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#meterWrap{margin:6px auto 0;max-width:420px;display:flex;align-items:center;gap:8px}
#meterWrap b{font-size:15px;white-space:nowrap;background:#fff;border:3px solid var(--line);border-radius:999px;padding:0 10px}
.bar{flex:1;height:16px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden}
#meter{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .2s}
#meter.melt{background:linear-gradient(90deg,#ff7a9a,#ffd0e0)}
#meter.low{animation:glow .4s infinite alternate}
@keyframes glow{to{filter:brightness(1.35)}}
#card{margin:8px auto 0;max-width:520px;background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:8px 14px;text-align:center;direction:rtl}
#card:empty{display:none}
#card .tag{display:inline-block;font-size:13px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:0 10px;margin-bottom:2px}
#card .clue{font-size:clamp(18px,4.4vw,24px);font-weight:700;line-height:1.35}
#card .clue .emo{font-size:1.25em;vertical-align:-3px;margin-inline-start:6px}
.slots{display:flex;justify-content:center;gap:5px;margin-top:6px;direction:rtl;flex-wrap:wrap}
.slot{width:38px;height:44px;border:3px dashed #9aa3b8;border-radius:10px;display:grid;place-items:center;font-size:28px;font-weight:800;background:#fff}
.slot.given{border-style:solid;border-color:#c5cbd8;color:#5b6478;background:#f4f6fb}
.slot.got{border-style:solid;border-color:var(--line);background:var(--mint);color:#fff}
.slot.next{border-color:var(--sun);border-style:solid;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(28px,7vw,48px);font-weight:800;color:#fff;-webkit-text-stroke:2px var(--line);text-shadow:0 4px 0 var(--line);pointer-events:none;transition:opacity .25s;opacity:0;white-space:pre-line;text-align:center;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .35s}

/* touch controls */
#touch{position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.tbtn{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:4px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);font-size:30px;display:grid;place-items:center;padding:0;font-weight:800;touch-action:none}
.tbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tgroup{display:flex;gap:12px;align-items:flex-end}
#sub{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,8px);width:max-content;max-width:min(560px,calc(100vw - 32px));background:rgba(27,36,64,.92);color:#fff;border-radius:16px;padding:8px 16px;font-size:clamp(16px,4.2vw,21px);font-weight:700;line-height:1.45;text-align:center;unicode-bidi:plaintext;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;z-index:30}
#sub.on{opacity:1;transform:translate(-50%,0)}#sub.ok{background:rgba(31,140,96,.95)}
#scWhy{background:#ffe3e3;border:2px solid #e05a5a;border-radius:14px;padding:4px 10px;font-size:15px;font-weight:700;margin:6px 0 0;unicode-bidi:plaintext}#scWhy:empty{display:none}#scSub{font-size:14px;font-weight:700;opacity:.85;margin:-4px 0 6px}#scSub:empty{display:none}
#card .clue,#card .tag,#goalT,#scGoal,#stText{unicode-bidi:plaintext}
#pickHint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:#fff;border:3px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:800;box-shadow:0 3px 0 var(--line);pointer-events:none;white-space:nowrap}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#4fb3ffcc,#8fd3ffcc);overflow:auto}
.panel{background:var(--cream);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);padding:18px 18px 16px;width:min(560px,100%);text-align:center;position:relative}
h1{margin:26px 0 0;font-size:clamp(36px,9vw,56px);line-height:1.05;color:var(--sun);-webkit-text-stroke:2px var(--line);text-shadow:0 5px 0 var(--line);font-weight:800}
h2{margin:4px 0 6px;font-size:24px}
.sub{margin:6px 0 12px;font-size:16px;line-height:1.5}
.backBtn{position:absolute;top:12px;inset-inline-end:12px;text-decoration:none;color:var(--ink);font-size:14px;padding:2px 12px}
.langs{position:absolute;top:12px;inset-inline-start:12px;display:flex;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:#fff;font-weight:800;padding:2px 12px;font-size:14px}
.langs button.on{background:var(--ink);color:#fff}
.ages{display:flex;gap:6px;justify-content:center;align-items:center;margin:0 0 12px;flex-wrap:wrap;font-weight:800}
.age{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--line);padding:0}
.age.on{background:var(--sun)}
.go{width:100%;border:4px solid var(--line);border-radius:999px;background:var(--mint);color:#fff;font-size:26px;font-weight:800;padding:6px 0;box-shadow:0 5px 0 var(--line);-webkit-text-stroke:1px var(--line)}
.go[disabled]{opacity:.5}
.ghost{border:3px solid var(--line);border-radius:999px;background:#fff;font-weight:800;font-size:16px;padding:4px 16px;box-shadow:0 3px 0 var(--line)}
.howto{font-size:13px;text-align:start;background:#eef6ff;border-radius:14px;padding:8px 12px;margin:0 0 12px;line-height:1.55}
.howto b{display:inline-block;min-width:64px}
.stars{font-size:40px;color:#d9dde6;letter-spacing:4px}
.stars .on{color:var(--sun);-webkit-text-stroke:2px var(--line)}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.row{display:flex;gap:8px;justify-content:center}
[dir=rtl] .howto{text-align:right}

/* hero card */
.me{display:flex;align-items:center;gap:16px;border:3px solid var(--line);border-radius:26px;background:linear-gradient(135deg,#fff3c4,#ffd29a);padding:10px 18px 10px 10px;margin:8px 0 14px;box-shadow:0 5px 0 var(--line);text-align:start}
.meStage{position:relative;width:150px;height:150px;flex:none;border-radius:20px;border:3px solid var(--line);overflow:hidden;background:radial-gradient(circle at 50% 38%,#fffaf0 0,#ffe1a8 72%)}
.meStage::after{content:'';position:absolute;left:22%;right:22%;bottom:9%;height:9%;border-radius:50%;background:rgba(16,35,63,.16)}
#pvMe{width:100%;height:100%;display:block;position:relative;z-index:1;transition:opacity .4s}
.meLoad{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;text-align:center;padding:8px;z-index:2}
.me.loading .meLoad{display:flex}.me.loading #pvMe{opacity:0}
.meLoad i{width:36px;height:36px;border-radius:50%;border:5px solid #fff;border-top-color:var(--line);animation:meSpin .9s linear infinite}
@keyframes meSpin{to{transform:rotate(360deg)}}
.meText small{display:block;font-weight:800;opacity:.75;font-size:15px}
.meText b{display:block;font-size:clamp(28px,7vw,38px);line-height:1.1}
.meTag{display:inline-block;margin-top:8px;background:var(--line);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800}
@media (max-width:420px){.meStage{width:118px;height:118px}}

/* festival gate progress */
.gate{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;direction:rtl;margin:6px 0 10px}
.gate i{font-style:normal;width:30px;height:36px;border-radius:9px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;color:#c5cbd8;box-shadow:0 2px 0 var(--line)}
.gate i.on{color:#fff;background:var(--c,var(--berry))}
.gate i.sp{border:0;background:none;box-shadow:none;width:10px}
.gate i.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ---------- map ---------- */
#map{align-items:start}
#map .panel{width:min(820px,100%);padding:12px}
.mapWrap{position:relative;border-radius:20px;overflow:hidden;border:3px solid var(--line);aspect-ratio:1344/752;background:#2a9fd0}
.mapWrap img{width:100%;height:100%;object-fit:cover;display:block}
.mapWrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(38px,7vw,54px);height:clamp(38px,7vw,54px);border-radius:50%;border:4px solid var(--line);background:#fff;font-weight:800;font-size:clamp(16px,3.4vw,22px);box-shadow:0 4px 0 var(--line);padding:0;display:grid;place-items:center}
.node.done{background:var(--mint);color:#fff}
.node.now{background:var(--sun);animation:pulse .7s infinite alternate}
.node.lock{background:#d9dde6;color:#8a91a5}
.node small{position:absolute;top:100%;margin-top:4px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;white-space:nowrap;color:var(--ink)}
.node .st{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;color:#d79a00;-webkit-text-stroke:1px var(--line);letter-spacing:-1px;white-space:nowrap}
#chCard{margin-top:10px;display:flex;gap:12px;align-items:center;text-align:start;background:#fff;border:3px solid var(--line);border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 var(--line)}
#chCard .tx{flex:1}#chCard .tx b{font-size:20px;display:block}#chCard .tx small{font-size:14px;display:block;line-height:1.4}
#chCard .go{width:auto;padding:4px 22px;font-size:22px}#chCard .gos{display:flex;flex-direction:column;gap:6px;align-items:stretch}#chCard .go2{background:#fff;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:14px;font-weight:700;padding:2px 10px;cursor:pointer}#chCard #chRes{font-size:17px;padding:4px 14px}
.mapTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mapTop h2{margin:0}

/* ---------- story ---------- */
#story{position:fixed;inset:0;background:#000;display:flex;flex-direction:column}
#stImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 12s ease-out forwards}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.stCap{position:absolute;left:0;right:0;bottom:0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(transparent,#000c 30%);display:flex;align-items:flex-end;gap:12px}
#stText{flex:1;margin:0;color:#fff;font-size:clamp(19px,4.2vw,28px);font-weight:700;line-height:1.5;text-shadow:0 2px 4px #000}
#stNext{flex:none;border:4px solid var(--line);border-radius:999px;background:var(--sun);font-size:22px;font-weight:800;padding:4px 22px;box-shadow:0 4px 0 var(--line)}
#stSkip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:14px;border:3px solid #fff;background:#0006;color:#fff;border-radius:999px;font-weight:800;padding:2px 14px}
#stBack{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-start:14px;width:40px;height:40px;border:3px solid #fff;background:#0006;color:#fff;border-radius:50%;font-weight:800;font-size:18px;padding:0;z-index:2}
#stDots{inset-inline-start:66px!important;position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);inset-inline-start:16px;display:flex;gap:6px}
#stDots i{width:10px;height:10px;border-radius:50%;background:#fff6}#stDots i.on{background:#fff}

/* stage card */
#stageCard .panel{max-width:460px}
#scNum{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;font-size:15px}
#scTitle{font-size:30px;margin:8px 0 4px}
#scGoal{font-size:18px;line-height:1.5;margin:0 0 12px}
#scIcon{font-size:54px;line-height:1}
.ctrl{font-size:13px;opacity:.8;margin-top:8px}
@media print{body *{visibility:hidden}#end,#end *{visibility:visible}#end{position:absolute;inset:0;background:#fff}#end .row{display:none}}

/* ---------- Pearl Diver additions ---------- */
:root{--sky:#1f8fc9}
html,body{background:#1f8fc9}
.screen{background:linear-gradient(#0f5f99cc,#1f8fc9cc)}
h1{color:#fff6fb}
.me{background:linear-gradient(135deg,#dff6ff,#a9e2ff)}
.meStage{background:radial-gradient(circle at 50% 38%,#ffffff 0,#9fd8ff 72%)}
#air{height:100%;width:100%;background:linear-gradient(90deg,#7ff9ff,#2fd39a);transition:width .15s}
#air.low{background:linear-gradient(90deg,#ff5f6d,#ffb13c);animation:glow .5s infinite alternate}
#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:130px;height:130px;border-radius:50%;background:#ffffff44;border:4px solid #ffffffaa;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;border:4px solid var(--line);box-shadow:0 4px 0 var(--line)}
#pointer{position:fixed;top:50%;font-size:40px;pointer-events:none;filter:drop-shadow(0 3px 0 var(--line));transform:translateY(-50%);z-index:5}
#read .panel{background:#fbf0d6;text-align:start}
#read .scrollT{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;font-weight:800;font-size:14px}
#read .passage{font-size:clamp(19px,4.6vw,23px);line-height:1.75;margin:10px 0;font-weight:600;direction:rtl;text-align:right}
#read .q{font-size:clamp(18px,4.4vw,21px);font-weight:800;margin:6px 0 10px;direction:rtl;text-align:right}
#read .opts{display:grid;gap:8px}
#read .opt{border:3px solid var(--line);border-radius:16px;background:#fff;font-size:18px;font-weight:700;padding:8px 12px;text-align:right;direction:rtl;box-shadow:0 3px 0 var(--line)}
#read .opt.ok{background:var(--mint);color:#fff}
#read .opt.no{background:#ffd3dc;opacity:.7}
#read .opt:disabled{color:inherit}#read .opt.ok:disabled{color:#fff}
#read .fb{min-height:28px;font-weight:800;margin-top:8px;text-align:center}
#prog{display:none}#prog.on{display:flex}
.pearls{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.pearls i{font-style:normal;width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:#e9eef6;box-shadow:0 2px 0 var(--line)}
.pearls i.on{background:radial-gradient(circle at 35% 30%,#fff 0,#fbeff6 45%,#d9c6dd 100%)}
.pearls i.dana{width:38px;height:38px;margin-top:-4px}
.pearls i.dana.on{background:radial-gradient(circle at 35% 30%,#fff 0,#ffe9a8 45%,#f2b84b 100%)}
.pearls i.pop{animation:pop .6s}
.mapWrap{aspect-ratio:1344/752;background:#1f8fc9}
</style>

<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="pills"><span class="pill" id="hearts"></span><span class="pill">🦪 <span id="score">0</span></span><span class="pill">🐚 <span id="shells">0</span></span><span class="pill" id="prog"></span></div>
    <div style="display:flex;gap:8px"><button class="iconbtn hidden" id="musicBtn" aria-label="Music">🎵</button><button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button></div>
  </div>
  <div id="goal"><div class="dots" id="dots"></div><span id="goalT"></span></div>
  <div id="meterWrap"><b id="airLbl"></b><div class="bar"><div id="air"></div></div></div>
  <div id="card"></div>
</div>
<div id="pointer" class="hidden">➜</div>
<div id="toast"></div>
<div id="sub" aria-live="polite"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>

<!-- title -->
<div class="screen" id="title">
  <div class="panel">
    <div class="langs"><button id="langAr" class="on">عربي</button><button id="langEn">English</button></div>
    <a class="ghost backBtn" id="hubBtn" href="index.html"></a>
    <h1 id="tTitle"></h1>
    <p class="sub" id="tTag"></p>
    <div class="me loading" id="meCard"><div class="meStage"><canvas id="pvMe" width="320" height="320"></canvas><div class="meLoad"><i></i><span id="meLoadT"></span></div></div><div class="meText"><small id="meT"></small><b id="meName"></b><span class="meTag" id="meTag"></span></div></div>
    <div class="ages" id="ages"><span id="ageT"></span><button class="age" data-a="8"></button><button class="age" data-a="9"></button><button class="age" data-a="10"></button><button class="age" data-a="11"></button><button class="age" data-a="12"></button></div>
    <div class="howto" id="howto"></div>
    <button class="go" id="startBtn"></button>
  </div>
</div>

<!-- voyage map -->
<div class="screen hidden" id="map">
  <div class="panel">
    <div class="mapTop"><button class="ghost" id="mapBack">⌂</button><h2 id="mapT"></h2><span class="pill">🐚 <span id="mapShells">0</span></span></div>
    <div class="mapWrap" id="mapWrap"><img id="mapImg" alt=""><svg id="mapPath" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div>
    <div id="gateT" style="font-weight:800;margin-top:8px"></div>
    <div class="pearls" id="gate"></div>
    <div id="chCard"></div>
  </div>
</div>

<!-- story -->
<div id="story" class="hidden">
  <img id="stImg" alt="">
  <div id="stDots"></div>
  <button id="stSkip"></button><button id="stBack" aria-label="Map">✕</button>
  <div class="stCap"><p id="stText"></p><button id="stNext">◀</button></div>
</div>

<!-- stage card -->
<div class="screen hidden" id="stageCard">
  <div class="panel">
    <button class="ghost backBtn" id="scBack"></button>
    <div id="scIcon"></div>
    <span id="scNum"></span>
    <h2 id="scTitle"></h2>
    <p id="scGoal"></p>

// ---------- update ----------
let shake = 0, time = 0;
function update(dt) {
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.v.y -= 4 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = Math.max(0, p.life); if (p.life <= 0) { scene.remove(p.m); parts.splice(i, 1); } }

  if (state !== 'play') return;

  if (keys.ArrowLeft || keys.a) ix = -1; if (keys.ArrowRight || keys.d) ix = 1;
  if (keys.ArrowUp || keys.w) iy = 1; if (keys.ArrowDown || keys.s) iy = -1;
  if (P.rescue > 0) { // pulled up by the crew
    P.rescue -= dt; P.x += (0 - P.x) * Math.min(1, 2.2 * dt); P.y += (SURF - 0.4 - P.y) * Math.min(1, 2.2 * dt); P.vx = P.vy = 0;

    return;
  }
  if (P.stun > 0) { P.stun -= dt; ix *= 0.2; iy *= 0.2; }
  const acc = 18 * P.slow, maxV = 6.2 * P.slow;
  P.vx += ix * acc * dt; P.vy += iy * acc * dt;
  if (current) P.vx += Math.sin(time * 0.35) * 2.2 * dt; // the storm's current pushes the diver
  const damp = Math.pow(0.12, dt); P.vx *= damp; P.vy *= damp;
  const sp = Math.hypot(P.vx, P.vy); if (sp > maxV) { P.vx *= maxV / sp; P.vy *= maxV / sp; }

  else P.air -= dt / [44, 38, 34][band()];
  if (P.air < 0.28 && !lowWarned) { lowWarned = true; toast(t('low'), 1.4); ev('low'); }
  if (P.air <= 0) { P.air = 0; hearts--; drawHearts(); P.rescue = 1.6; toast(t('rope'), 1.6); ev('rope'); sfx.bump(); if (S && STAGE[S.type].onHurt) STAGE[S.type].onHurt(S); if (S && S.ceil) { P.rescue = 0; P.air = 0.6; P.x = -R + 2; P.y = BED + 4; P.invuln = 1.5; if (hearts <= 0) failStage('stage_fail', t('noHearts')); } }
  drawAir();
  // jellyfish
  for (const j of jellies) {
    j.p += dt; j.g.position.x = j.x0 + Math.sin(j.p * 0.5) * j.amp; j.g.position.y = j.y0 + Math.sin(j.p * 1.3) * 0.8;
    if (P.invuln <= 0 && Math.hypot(P.x - j.g.position.x, P.y - j.g.position.y) < 1.1) { toast(t('jelly'), 1); ev('jelly'); hurt(j.g.position.x, j.g.position.y, 0.15); }
  }

  for (const o of objs) if (o.kind === 'shell' && near(o.x, o.y, 1.4)) { delObj(o); chRun.shells++; score += 10; drawScore(); sfx.shell(); toast(t('shell'), 1.1); burst(o.x, o.y, 20, 0xffd23f); break; }
  if (S) STAGE[S.type].update(S, dt);

function visuals(dt) {
  time += dt;
  for (const a of ambient) {
    if (a.kind === 'weed') a.o.children.forEach((b, i) => { b.rotation.z = Math.sin(time * 1.4 + a.o.userData.sway + i * 0.5) * 0.12 * (i + 1) * 0.4 + (current ? Math.sin(time * 0.35) * 0.25 : 0); });
    else if (a.kind === 'fish') { a.o.position.x += a.o.userData.dir * dt * 1.6; if (a.o.position.x > R + 14) a.o.position.x = -R - 14; if (a.o.position.x < -R - 14) a.o.position.x = R + 14; }
