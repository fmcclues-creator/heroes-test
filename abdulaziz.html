<style>
:root{--ink:#10233f;--cream:#fff8ec;--sun:#ffc93c;--line:#10233f}

.emo{font-size:46px}
.game b{font-size:24px;display:block}
.game small{font-size:15px;font-weight:600;display:block;line-height:1.4}
