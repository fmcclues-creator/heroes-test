<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letter Kart</title>
<meta name="theme-color" content="#4fb3ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed 3D chase view; pill HUD on top, challenge card under it, racer faces down the left edge, steer buttons in the bottom corners with the item button between */
:root{
  --sky:#8fd3ff; --ink:#1d2a4a; --sun:#ffc93c; --leaf:#3fb85c; --coral:#ff5f6d; --teal:#18b5a6; --grape:#8a5cf0; --paper:#fffaf0; --mist:rgba(255,255,255,.9);
  --font:"Baloo Bhaijaan 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2}
.row{display:flex;gap:7px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-size:18px;line-height:1.3;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.num{direction:ltr;font-variant-numeric:tabular-nums}
.place{font-size:24px;padding:0 14px;background:var(--sun)}
.time{margin-inline-start:auto}
.homeBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;flex:none}
.homeBtn svg{width:20px;height:20px}
.letters{display:flex;flex-wrap:wrap;gap:3px}
.chip{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:14px;line-height:1;border:2px dashed rgba(29,42,74,.45);background:rgba(255,255,255,.6);color:rgba(29,42,74,.45)}
.chip.got{border:2px solid var(--ink);color:#fff;box-shadow:0 2px 0 var(--ink);-webkit-text-stroke:.6px var(--ink)}
.card2{align-self:center;display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:6px 14px 6px 10px;max-width:100%}
.card2 .pic{font-family:var(--emoji);font-size:40px;line-height:1}
.card2 .col{display:grid;gap:2px;justify-items:center}
.card2 .ghost{font-weight:800;font-size:18px;line-height:1.1;color:rgba(29,42,74,.38)}
.card2 .ask{font-weight:700;font-size:15px;line-height:1.2;max-width:170px;text-align:center}
.bigL{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:40px;line-height:1;color:#fff;background:var(--grape);border:3px solid var(--ink);-webkit-text-stroke:1px var(--ink);box-shadow:0 3px 0 var(--ink)}
.slots{display:flex;gap:4px}
.slot{width:34px;height:38px;border-radius:9px;border:2px dashed rgba(29,42,74,.45);display:grid;place-items:center;font-weight:800;font-size:24px;line-height:1;background:#fff}
.slot.next{border:2px solid var(--ink);background:#fff6d6;animation:pulse 1s ease-in-out infinite}
.slot.got{border:2px solid var(--ink);color:#fff;-webkit-text-stroke:.7px var(--ink);box-shadow:0 2px 0 var(--ink)}
@keyframes pulse{50%{transform:scale(1.08)}}
.ranks{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:44%;transform:translateY(-50%);display:grid;gap:6px;z-index:2;pointer-events:none}
.rk{display:flex;align-items:center;gap:4px;transition:transform .3s}
.rk b{width:18px;text-align:center;font-weight:800;font-size:15px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.face{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:0 2px 0 var(--ink)}
.rk.me .face{border:3px solid var(--sun);box-shadow:0 0 0 2px var(--ink)}
.steer{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:92px;height:92px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 var(--ink);z-index:3;touch-action:none;display:grid;place-items:center;padding:0}
.steer svg{width:44px;height:44px}
.steer.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:var(--sun)}
#leftBtn{left:calc(max(14px,env(safe-area-inset-left,0px)) + 4px)}
#rightBtn{right:calc(max(14px,env(safe-area-inset-right,0px)) + 4px)}
.itemBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:80px;height:80px;border-radius:22px;border:3px solid var(--ink);background:var(--sun);box-shadow:0 5px 0 var(--ink);z-index:3;touch-action:none;display:grid;place-items:center;padding:0;font-family:var(--emoji);font-size:42px;line-height:1}
.jumpBtn{position:fixed;right:calc(max(14px,env(safe-area-inset-right,0px)) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);background:#2f7de1;box-shadow:0 5px 0 var(--ink);z-index:3;touch-action:none;display:grid;place-items:center;padding:0}
.jumpBtn svg{width:36px;height:36px}
.jumpBtn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.itemBtn.empty{background:rgba(255,255,255,.55);border-style:dashed;box-shadow:none;font-family:var(--font);font-size:30px;color:rgba(29,42,74,.4)}
.itemBtn.ready{animation:pulse .8s ease-in-out infinite}
.count{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-weight:800;font-size:110px;line-height:1;color:var(--sun);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);z-index:4;pointer-events:none;white-space:nowrap}
.tag{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink);padding:6px 20px 6px 6px;z-index:4;pointer-events:none}
.tag .face{width:52px;height:52px}
.tag b{font-size:28px;font-weight:800;line-height:1}
.skip{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-weight:700;font-size:13px;background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;z-index:4;pointer-events:none}
.toast{position:fixed;left:50%;top:46%;transform:translateX(-50%);font-weight:800;font-size:28px;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);z-index:2;pointer-events:none;transition:opacity .4s, transform .4s;white-space:pre-line;text-align:center;width:max-content;max-width:calc(100vw - 32px);line-height:1.25}
.toast.off{opacity:0;transform:translateX(-50%) translateY(-10px)}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);display:grid;place-items:center;gap:8px;z-index:2;pointer-events:none;transition:opacity .35s, transform .35s}
.pop.off{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.pop .big{min-width:110px;height:110px;padding:0 18px;border-radius:28px;display:grid;place-items:center;font-weight:800;font-size:76px;line-height:1;color:#fff;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;background:var(--teal)}
.pop .big.emo{font-family:var(--emoji);-webkit-text-stroke:0;background:#fff}
.pop .nm{font-weight:800;font-size:22px;background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:0 14px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 80px) calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;background:linear-gradient(180deg,rgba(143,211,255,.05),rgba(29,42,74,.38))}
.card{width:min(440px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:18px 20px 22px;text-align:center;display:grid;gap:12px;position:relative}
.hero{display:block;height:140px;width:auto;margin:-96px auto -8px;filter:drop-shadow(0 6px 0 rgba(29,42,74,.22))}
.card h1{font-weight:800;font-size:clamp(40px,11vw,56px);line-height:1.05;margin:0;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-wrap:balance}
.card h2{font-weight:800;font-size:30px;margin:0;line-height:1.1;text-wrap:balance}
.card h3{font-weight:800;font-size:18px;margin:0}
.card p{margin:0;font-size:16px;line-height:1.5;font-weight:500}
.lang{position:absolute;top:12px;inset-inline-end:12px;display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;z-index:1}
.lang button{border:0;background:transparent;font-family:var(--font);font-weight:800;font-size:14px;padding:3px 11px;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:7px 4px 6px;font-family:var(--font);color:var(--ink);cursor:pointer;display:grid;min-width:0}
.lvl .n{font-weight:800;font-size:20px;line-height:1.15}
.lvl .nm{font-size:12.5px;font-weight:700;line-height:1.25}
.lvl[aria-pressed="true"]{background:var(--sun);box-shadow:0 4px 0 var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;text-align:start;font-size:14px;font-weight:500;background:rgba(143,211,255,.25);border-radius:16px;padding:9px 14px;line-height:1.4}
.keys b{font-weight:800}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go{font-family:var(--font);font-weight:800;font-size:24px;line-height:1.2;border:3px solid var(--ink);background:var(--leaf);color:#fff;border-radius:18px;padding:9px 20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;flex:1 1 auto}
.go.alt{background:#fff;color:var(--ink);-webkit-text-stroke:0;font-size:19px;flex:0 1 auto;display:flex;align-items:center;gap:8px;justify-content:center}
.go.alt svg{width:22px;height:22px;flex:none}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.podium{display:grid;gap:6px}
.pr{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 12px 4px 6px;text-align:start}
.pr.me{background:#fff6d6}
.pr b{font-weight:800;font-size:20px;width:30px;text-align:center}
.pr span{font-weight:700;font-size:17px}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.st{aspect-ratio:3/4;border-radius:16px;background:#fff;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink),0 4px 0 2px var(--ink);display:grid;place-items:center;align-content:center;gap:2px;position:relative;overflow:hidden;max-width:100%}
.st:nth-child(3n){transform:rotate(-3deg)}.st:nth-child(3n+1){transform:rotate(2deg)}
.st .e{font-family:var(--emoji);font-size:38px;line-height:1.1}
.st .w{font-weight:800;font-size:14px;line-height:1.1;padding:0 4px;text-align:center}
.st::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 60%);pointer-events:none}
.st.locked{background:#e8edf5;box-shadow:0 0 0 2px rgba(29,42,74,.3);transform:none}
.st.locked .e{filter:grayscale(1) brightness(.4);opacity:.25}
.st.locked .w{opacity:.35}
.st.locked::after{display:none}
.st.new{animation:stk .6s ease-out}
@keyframes stk{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.1) rotate(4deg)}}
.st .badge{position:absolute;top:4px;inset-inline-end:4px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:0 6px;line-height:1.6}
.albumHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.albumHead h2{font-size:26px}
.closeBtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-family:var(--font);font-weight:800;font-size:20px;cursor:pointer;flex:none}
.tabs{display:flex;gap:6px;justify-content:center}
.tabs button{font-family:var(--font);font-weight:800;font-size:14px;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
@media (prefers-reduced-motion: reduce){.toast,.pop,.rk{transition:none}.slot.next,.itemBtn.ready,.st.new{animation:none}}
.worldBtn{position:absolute;top:12px;inset-inline-start:12px;display:flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:2px 10px 2px 6px;font-family:var(--font,inherit);font-weight:800;font-size:13px;color:var(--ink);text-decoration:none;z-index:1}
.worldBtn svg{width:18px;height:18px;flex:none}
</style>

<canvas id="game" tabindex="0" aria-label="Letter Kart"></canvas>

<div class="hud" id="hud" hidden>
  <div class="row">
    <button class="homeBtn" id="homeBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M6 10v9h4.5v-5h3v5H18v-9" fill="none" stroke="#1d2a4a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="pill place" id="place">1st</div>
    <div class="pill" id="lap"></div>
    <div class="pill time num" id="time">0:00</div>
  </div>
  <div class="letters" id="letterStrip"></div>
  <div class="card2" id="chCard" hidden></div>
</div>
<div class="ranks" id="ranks" hidden></div>
<div class="count" id="count" hidden>3</div>
<div class="tag" id="tag" hidden><img class="face" id="tagFace" alt=""><b id="tagName"></b></div>
<div class="skip" id="skip" hidden></div>
<div class="toast off" id="toast"></div>
<div class="pop off" id="pop"><div class="big" id="popBig">ب</div><div class="nm" id="popName"></div></div>
<button class="steer" id="leftBtn" hidden aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="#1d2a4a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button class="steer" id="rightBtn" hidden aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="#1d2a4a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button class="itemBtn empty" id="itemBtn" hidden aria-label="Use power-up">?</button>
<button class="jumpBtn" id="jumpBtn" hidden aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M5 15c2-5 5-8 7-8s5 3 7 8M12 7v13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<div class="overlay" id="menu">
  <div class="card">
    <a class="worldBtn" id="worldBtn" href="index.html" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#8fd3ff" stroke="#1d2a4a" stroke-width="2"/><path d="M7 10c2-1 3 1 5 0s2-3 4-2M8 15c2 1 4-1 6 0" fill="none" stroke="#3fb85c" stroke-width="2.4" stroke-linecap="round"/></svg><span id="worldLbl"></span></a>
    <div class="lang" role="group" aria-label="Language"><button id="langEn" aria-pressed="true">English</button><button id="langAr" aria-pressed="false">عربي</button></div>
    <img class="hero" id="heroImg" alt="">
    <h1 data-t="title">Letter Kart</h1>
    <p data-t="intro"></p>
    <div class="levels" id="levelBtns"></div>
    <div class="keys" id="keys"></div>
    <div class="btns"><button class="go alt" id="albumBtn"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3" fill="#ff9ec4" stroke="#1d2a4a" stroke-width="2"/><path d="M8 3v18" stroke="#1d2a4a" stroke-width="2"/><circle cx="14" cy="10" r="2.6" fill="#ffd23a" stroke="#1d2a4a" stroke-width="1.6"/></svg><span id="albumLbl"></span></button><button class="go" id="playBtn" data-t="play">Race</button></div>
  </div>
</div>
<div class="overlay" id="endCard" hidden>
  <div class="card">
    <img class="hero" id="endImg" alt="">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div class="podium" id="podium"></div>
    <div class="stats" id="endStats"></div>
    <div id="newWrap" hidden><h3 id="newTitle"></h3><div class="stickers" id="newStickers" style="margin-top:8px"></div></div>
    <div class="btns"><button class="go alt" id="menuBtn" data-t="menu"></button><button class="go" id="againBtn" data-t="again"></button></div>
  </div>
</div>
<div class="overlay" id="album" hidden>
  <div class="card">
    <div class="albumHead"><h2 id="albumTitle"></h2><button class="closeBtn" id="albumClose" aria-label="Close">✕</button></div>
    <p id="albumCount"></p>
    <div class="tabs"><button id="tabWords" aria-pressed="true"></button><button id="tabAch" aria-pressed="false"></button></div>
    <div class="stickers" id="albumGrid"></div>
  </div>
</div>

  // Khaled: back of his head while driving; he turns to look back when chased or cheers after a word
  const dd = player.driver.userData;
  player.lookCd -= dt; player.lookT = Math.max(0, player.lookT - dt); player.cheerT = Math.max(0, player.cheerT - dt);
  if (state === 'race' && player.lookCd <= 0 && ais.some(a => { const g = progress(player) - progress(a); return g > 2 && g < 14; })) { player.lookT = 1.1; player.lookCd = 7; }
  const camFront = (() => { const fx = Math.sin(player.h), fz = Math.cos(player.h), cx = camera.position.x - player.x, cz = camera.position.z - player.z; return fx * cx + fz * cz > 0; })();
  const showFace = camFront || player.lookT > 0 || player.cheerT > 0;
  dd.front.visible = showFace; dd.back.visible = !showFace;
  dd.front.position.x = !camFront && (player.lookT > 0 || player.cheerT > 0) ? 0.18 : 0;
  const cheer = player.cheerT > 0 || state === 'finish' || state === 'results';
  dd.arms[0].rotation.set(cheer ? -2.9 : -1.05, 0, -0.32 + player.steer * 0.25); dd.arms[1].rotation.set(cheer && state !== 'race' ? -2.9 : -1.05, 0, 0.32 + player.steer * 0.25);
  // blocks, items, bubbles
  for (const b of blocks) if (!b.taken) { b.m.position.y = 1.9 + Math.sin(time * 3 + b.i) * 0.2; if (b.ring) { b.ring.position.y = b.m.position.y; b.ring.rotation.z += dt * 2; b.ring.scale.setScalar(1 + Math.sin(time * 6) * 0.06); } }
  for (const ib of itemBoxes) if (ib.off <= 0) { ib.m.rotation.y += dt * 1.6; ib.m.rotation.x = Math.sin(time * 2 + ib.lat) * 0.3; ib.m.position.y = 1.4 + Math.sin(time * 3 + ib.lat) * 0.15; }
  for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.life -= dt; q.v.y -= 16 * dt; q.m.position.addScaledVector(q.v, dt); q.m.rotation.x += dt * 6; q.m.scale.setScalar(Math.max(0.01, q.life)); if (q.life <= 0) { scene.remove(q.m); parts.splice(i, 1); } }
  for (let i = dust.length - 1; i >= 0; i--) { const q = dust[i]; q.life -= dt; q.m.position.y += dt * 1.5; q.m.scale.setScalar(1 + (0.5 - q.life) * 3); if (q.life <= 0) { scene.remove(q.m); dust.splice(i, 1); } }
  // scenery motion
  for (const f of LV.anim) f(dt);
  for (const c of clouds) { c.position.x += c.userData.s * dt; if (c.position.x > centroid.x + 280) c.position.x = centroid.x - 240; }
  const crowd = LV.crowd;
  if (crowd) {
    crowd.excite = Math.max(0, crowd.excite - dt);
    const near = Math.hypot(player.x - crowd.g.position.x, player.z - crowd.g.position.z) < 45 ? 1 : 0;
    for (let n = 0; n < crowd.spots.length; n++) { const s = crowd.spots[n], j = Math.max(0, Math.sin(time * (6 + n % 3) + s.ph)) * (0.25 + (near + crowd.excite) * 0.4); crowd.o.position.set(s.x, s.y + j, s.z); crowd.o.updateMatrix(); crowd.im.setMatrixAt(n, crowd.o.matrix); }
    crowd.im.instanceMatrix.needsUpdate = true;
  }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.add('off'); }
  if (popT > 0) { popT -= dt; if (popT <= 0) $('pop').classList.add('off'); }
  if (engine) { const on = ['race', 'count', 'finish', 'intro'].includes(state); engine.g.gain.value += ((on ? 0.02 : 0) - engine.g.gain.value) * Math.min(1, 4 * dt); engine.o.frequency.value = 55 + player.speed * 4.2 + (player.boost > 0 ? 30 : 0); }
  if (player.roll > 0) drawItem();
  if (state === 'race' || state === 'finish' || state === 'count') updateHud();

  // ---------- camera ----------
  let want, look, rate = 6;
  if (state === 'menu') {
    menuT += dt; const a = menuT * 0.25 + 0.6;
    want = new V3(player.x + Math.sin(player.h + a) * 8.5, 3.2, player.z + Math.cos(player.h + a) * 8.5); look = new V3(player.x, 1.7, player.z); rate = 2.5;
  } else if (state === 'intro') {
    const n = Math.min(3, Math.floor(introT / INTRO_EACH)), k = karts[INTRO_ORDER[n]], f = (introT % INTRO_EACH) / INTRO_EACH;
    const fx = Math.sin(k.h), fz = Math.cos(k.h), side = (f - 0.5) * 2.2;
    want = new V3(k.x + fx * 5.2 + fz * side, 3.1, k.z + fz * 5.2 - fx * side); look = new V3(k.x, 2.0, k.z); rate = n === 0 && f < 0.1 ? 30 : 7;
    $('tagName').textContent = t('names')[k.name]; $('tagFace').src = k.face; if (introSaid !== n) { introSaid = n; voice('name-' + RACER_KEYS[k.name], introSaid === 0 ? 'queue' : 'now'); }
  } else if (state === 'finish' || state === 'results') {
    const fx = Math.sin(player.h), fz = Math.cos(player.h);
    want = new V3(player.x + fx * 6.5 + fz * 2.5, player.y + 2.6, player.z + fz * 6.5 - fx * 2.5); look = new V3(player.x, player.y + 1.8, player.z); rate = 3;
  } else {
    camYaw += (((player.h - camYaw + Math.PI * 3) % TAU) - Math.PI) * Math.min(1, 4.5 * dt);
    camY += (player.y * 0.7 + 3.6 - camY) * Math.min(1, 5 * dt);
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw), dist = 7.8 + (player.boost > 0 ? 1 : 0);
    want = new V3(player.x - fx * dist, camY, player.z - fz * dist); look = new V3(player.x + fx * 5, player.y * 0.8 + 1.4, player.z + fz * 5); rate = 14;
  }
  if (state !== 'race' && state !== 'count') camYaw = Math.atan2(look.x - want.x, look.z - want.z);
  const k = 1 - Math.exp(-rate * dt);
  camPos.lerp(want, k); camLook.lerp(look, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  const fov = baseFov + (player.boost > 0 ? 9 : 0) + Math.min(6, player.speed * 0.15);
  camera.fov += (fov - camera.fov) * Math.min(1, 4 * dt); camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  if (LV.skySprite) LV.skySprite.position.set(camera.position.x - 260, camera.position.y + 170, camera.position.z - 300);
  light.position.set(player.x + 20, 40, player.z + 12); light.target.position.set(player.x, 0, player.z);
}

// ================= boot =================
buildWorld(diff); applyLang(); placeGrid();
camPos.set(player.x + 8, 4, player.z + 8); camLook.set(player.x, 1.6, player.z);
if (document.fonts && document.fonts.load) document.fonts.load('800 170px "Baloo Bhaijaan 2"', 'أبتABC').then(() => { for (const k in texCache) if (k[0] === 'L') delete texCache[k]; }).catch(() => {});
const STEP = 1 / 60; let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  let n = 0; while (acc >= STEP && n < 6) { sim(STEP); acc -= STEP; n++; } if (n === 6) acc = 0;
  visuals(dt); renderer.render(scene, camera);
}
window.__kart = { sim, visuals, render: () => renderer.render(scene, camera), get state() { return state; }, player, ais, get stats() { return { gotLetters, matched, wordsDone, place, earned: earned.length }; } };
requestAnimationFrame(frame);
})();
</script>
