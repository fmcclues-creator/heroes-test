<style>
:root{
  --ink:#10233f; --cream:#fff8ec; --sea:#1f8fc9; --sun:#ffc93c; --mint:#2fd39a; --berry:#ff5f8f; --pearl:#fff6fb; --line:#10233f;
  --font:'Baloo Bhaijaan 2',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#1f8fc9;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font-family:var(--font);color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:3px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;display:grid;place-items:center;padding:0}
#airWrap{margin:8px auto 0;max-width:420px;display:flex;align-items:center;gap:8px;color:#fff;-webkit-text-stroke:.5px var(--line)}
#airWrap b{font-size:16px;white-space:nowrap;font-weight:800}
.bar{flex:1;height:16px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden}
#air{height:100%;width:100%;background:linear-gradient(90deg,#7ff9ff,#2fd39a);transition:width .15s}
#air.low{background:linear-gradient(90deg,#ff5f6d,#ffb13c);animation:blink .5s infinite alternate}
@keyframes blink{to{filter:brightness(1.4)}}
#card{margin:10px auto 0;max-width:520px;background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:8px 14px;text-align:center;direction:rtl}
#card .tag{display:inline-block;font-size:13px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:0 10px;margin-bottom:2px}
#card .clue{font-size:clamp(18px,4.4vw,24px);font-weight:700;line-height:1.35}
#card .clue .emo{font-size:1.25em;vertical-align:-3px;margin-inline-start:6px}
.slots{display:flex;justify-content:center;gap:5px;margin-top:6px;direction:rtl;flex-wrap:wrap}
.slot{width:38px;height:44px;border:3px dashed #9aa3b8;border-radius:10px;display:grid;place-items:center;font-size:28px;font-weight:800;background:#fff}
.slot.given{border-style:solid;border-color:#c5cbd8;color:#5b6478;background:#f4f6fb}
.slot.got{border-style:solid;border-color:var(--line);background:var(--mint);color:#fff}
.slot.next{border-color:var(--sun);border-style:solid;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);font-size:clamp(26px,6.5vw,44px);font-weight:800;color:#fff;-webkit-text-stroke:2px var(--line);text-shadow:0 4px 0 var(--line);pointer-events:none;transition:opacity .25s;opacity:0;white-space:pre-line;text-align:center;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
#pointer{position:fixed;top:50%;font-size:40px;pointer-events:none;filter:drop-shadow(0 3px 0 var(--line));transform:translateY(-50%)}

/* touch joystick */
#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:130px;height:130px;border-radius:50%;background:#ffffff44;border:4px solid #ffffffaa;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;border:4px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* screens */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#0f5f99cc,#1f8fc9cc);overflow:auto}
.panel{background:var(--cream);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);padding:18px 18px 16px;width:min(560px,100%);text-align:center;position:relative;box-sizing:border-box}
h1{margin:30px 0 0;font-size:clamp(36px,9vw,56px);line-height:1.05;color:var(--pearl);-webkit-text-stroke:2px var(--line);text-shadow:0 5px 0 var(--line);font-weight:800}
h2{margin:4px 0 6px;font-size:24px}
.sub{margin:6px 0 12px;font-size:16px;line-height:1.45}
.langs{position:absolute;top:12px;inset-inline-start:12px;display:flex;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:#fff;font-weight:800;padding:2px 12px;font-size:14px}
.langs button.on{background:var(--ink);color:#fff}
.me{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:20px;background:#e6f6ff;padding:6px 14px 6px 6px;margin:6px 0 12px;box-shadow:0 4px 0 var(--line);text-align:start}
.me canvas{width:110px;height:110px;border-radius:14px;background:#bfe7ff}
.me b{font-size:26px;display:block}.me small{font-size:14px;font-weight:600}
.ages{display:flex;gap:6px;justify-content:center;align-items:center;margin:0 0 12px;flex-wrap:wrap;font-weight:800}
.age{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--line);padding:0}
.age.on{background:var(--sun)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lvl{border:3px solid var(--line);border-radius:16px;background:#fff;padding:6px 4px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--line);line-height:1.2}
.lvl small{display:block;font-weight:500;font-size:12px}
.lvl .st{font-size:13px;color:#d79a00;letter-spacing:1px}
.lvl.on{background:var(--sun)}
.lvl[disabled]{opacity:.45;cursor:default}
.go{width:100%;border:4px solid var(--line);border-radius:999px;background:var(--mint);color:#fff;font-size:26px;font-weight:800;padding:6px 0;box-shadow:0 5px 0 var(--line);-webkit-text-stroke:1px var(--line)}
.ghost{border:3px solid var(--line);border-radius:999px;background:#fff;font-weight:800;font-size:16px;padding:4px 16px;box-shadow:0 3px 0 var(--line)}
.howto{font-size:13px;text-align:start;background:#eef6ff;border-radius:14px;padding:8px 12px;margin:0 0 12px;line-height:1.55}
.howto b{display:inline-block;min-width:64px}
.stars{font-size:40px;color:#d9dde6;letter-spacing:4px}
.stars .on{color:var(--sun);-webkit-text-stroke:2px var(--line)}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.learned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl;margin:6px 0 12px}
.learned span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:0 8px;font-weight:700;font-size:16px}
.learned span.miss{background:#ffe1e8}
.row{display:flex;gap:8px;justify-content:center}
#endImg{width:110px;height:110px;margin:-6px auto 0}
/* reading scroll */
#read .panel{background:#fbf0d6;direction:rtl;text-align:right}
#read .scrollT{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;font-weight:800;font-size:14px}
#read .passage{font-size:clamp(19px,4.6vw,23px);line-height:1.75;margin:10px 0;font-weight:600}
#read .q{font-size:clamp(18px,4.4vw,21px);font-weight:800;margin:6px 0 10px}
#read .opts{display:grid;gap:8px}
#read .opt{border:3px solid var(--line);border-radius:16px;background:#fff;font-size:18px;font-weight:700;padding:8px 12px;text-align:right;box-shadow:0 3px 0 var(--line)}
#read .opt.ok{background:var(--mint);color:#fff}
#read .opt.no{background:#ffd3dc;opacity:.7}
#read .opt:disabled{color:inherit}#read .opt.ok:disabled{color:#fff}
#read .fb{min-height:28px;font-weight:800;margin-top:8px;text-align:center}
[dir=rtl] .howto{text-align:right}

/* detective */
#topRow{display:flex;gap:8px;justify-content:center;margin-top:8px}
#goalBar{margin:8px auto 0;max-width:520px;background:var(--cream);border:3px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:6px 14px;text-align:center;font-weight:800;font-size:clamp(15px,3.8vw,19px);direction:rtl}
#solveBtn,#bookBtn{pointer-events:auto;border:3px solid var(--line);border-radius:999px;background:#fff;font-weight:800;font-size:16px;padding:4px 14px;box-shadow:0 3px 0 var(--line)}
#solveBtn.ready{background:var(--sun);animation:blink .6s infinite alternate}
#actBtn{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);border:4px solid var(--line);border-radius:999px;background:var(--sun);font-size:24px;font-weight:800;padding:10px 26px;box-shadow:0 5px 0 var(--line)}
#read .panel,#book .panel{background:#fbf0d6;direction:rtl;text-align:right}
#rWho{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}
#rText{font-size:clamp(19px,4.6vw,23px);line-height:1.75;margin:10px 0;font-weight:600;white-space:pre-line}
#rQ{font-size:clamp(18px,4.4vw,21px);font-weight:800;margin:6px 0 10px}
#rOpts{display:grid;gap:8px}
#bookList,#learned{text-align:right;direction:rtl;line-height:1.7;font-size:17px;padding-inline-start:20px;margin:8px 0 12px}
#rText{max-height:40vh;overflow:auto}

/* hero card: the child's own 3D character, turning slowly */
.me{display:flex;align-items:center;gap:16px;border:3px solid var(--line);border-radius:26px;background:linear-gradient(135deg,#fff1d6,#f7cf9c);padding:10px 18px 10px 10px;margin:8px 0 14px;box-shadow:0 5px 0 var(--line);text-align:start}
.meStage{position:relative;width:150px;height:150px;flex:none;border-radius:20px;border:3px solid var(--line);overflow:hidden;background:radial-gradient(circle at 50% 38%,#fffaf0 0,#ffd9a0 72%)}
.meStage::after{content:'';position:absolute;left:22%;right:22%;bottom:9%;height:9%;border-radius:50%;background:rgba(16,35,63,.16)}
#pvMe{width:100%;height:100%;display:block;position:relative;z-index:1;transition:opacity .4s;background:none;border-radius:0}
.meLoad{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;text-align:center;padding:8px;z-index:2}
.me.loading .meLoad{display:flex}.me.loading #pvMe{opacity:0}
.meLoad i{width:36px;height:36px;border-radius:50%;border:5px solid #fff;border-top-color:var(--line);animation:meSpin .9s linear infinite}
@keyframes meSpin{to{transform:rotate(360deg)}}
.meText small{display:block;font-weight:800;opacity:.75;font-size:15px}
.meText b{display:block;font-size:clamp(28px,7vw,38px);line-height:1.1}
.meTag{display:inline-block;margin-top:8px;background:var(--line);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800}
@media (max-width:420px){.meStage{width:118px;height:118px}}
</style>
<canvas id="c"></canvas>
<div id="hud" class="hidden">

</div>

</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
// ---------- THE CHILD (set per order — same block in every game of the bundle) ----------
const CHILD = {
  name: { ar: 'ميار', en: 'Mayar' },
  gender: 'girl',
  skin: 0xd09a74, hair: 0x24170f, hijab: false,
  suit: { main: 0xb8264a, accent: 0xff8a65, glow: 0x7ff9ff, veh: 0xffb000 },
  age: 9,
  headFront: null, headBack: null,
  runModel: 'mayar-run.gltf.json', swimModel: 'mayar-swim.gltf.json', walkModel: 'mayar-run.gltf.json'
};
// ====================================================================================
//  Little Detective · المحقق الصغير — Arabic reading comprehension for ages 8–12.
//  The child walks through Souq Al-Mubarakiya as the detective. Each case: talk to the
//  people of the souq (read what they say + answer a question to earn a clue card),
//  inspect sparkling spots for hidden clues, then decide where the lost thing is and
//  walk there to solve it. Gentle cases only: lost things and happy surprises.
// ====================================================================================
const SAVE_KEY = 'littledetective.v1';
let save = { age: 0, unlocked: 0, stars: [0, 0, 0] };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (_) {}
let lang = 'ar';
try { const sl = sessionStorage.getItem('abdullahworld.lang'); if (sl === 'en' || sl === 'ar') lang = sl; } catch (_) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }
function kidName() { return CHILD.name[lang] || CHILD.name.ar; }
const G = CHILD.gender === 'girl';

const T = {
  ar: {
    age: 'كم عمرك؟', title: 'المحقق الصغير', titleG: 'المحققة الصغيرة',
    tagline: 'تجوّل في سوق المباركية، اقرأ ما يقوله النّاس، واجمع الأدلّة لتحلّ القضيّة! للأعمار من ٨ إلى ١٢ سنة.',
    me: 'المحقّق', meG: 'المحقّقة', go: 'هيّا يا',
    levels: [['القطّة الضائعة', 'القضيّة ١'], ['الرّسالة الغامضة', 'القضيّة ٢'], ['اللّؤلؤة المفقودة', 'القضيّة ٣']],
    howto: '<b>امشِ</b> بالأسهم أو المس الأرض أو عصا التحكّم<br><b>تحدّث</b> اقترب من الشّخص واضغط الزّر أو المسافة<br><b>حلّ</b> اجمع كلّ الأدلّة ثمّ اختر الجواب',
    play: 'ابدأ التّحقيق!', talk: 'تحدّث', inspect: 'افحص', notebook: 'دفتر الأدلّة', clues: 'الأدلّة', solve: 'حلّ القضيّة', lvl: 'القضيّة',
    right: 'إجابة صحيحة! حصلت على دليل', rightG: 'إجابة صحيحة! حصلتِ على دليل', rightSolve: 'إجابة صحيحة! توجّه إلى المكان الذي اخترته.', rightSolveG: 'إجابة صحيحة! توجّهي إلى المكان الذي اخترتِه.', wrong: 'اقرأ مرّة أخرى وحاول', cont: 'تابع',
    find: 'ابحث عن الأدلّة', allClues: 'جمعت كلّ الأدلّة! اضغط «حلّ القضيّة»', allCluesG: 'جمعتِ كلّ الأدلّة! اضغطي «حلّ القضيّة»',
    solveQ: 'فكّر في الأدلّة', goThere: 'اذهب إلى هناك!', goThereG: 'اذهبي إلى هناك!', notYet: 'لم تجمع كلّ الأدلّة بعد', notYetG: 'لم تجمعي كلّ الأدلّة بعد',
    solved: 'حُلّت القضيّة!', win: 'أحسنت يا {n}!', winG: 'أحسنتِ يا {n}!', accuracy: 'الدّقّة', learned: 'الأدلّة التي جمعتها', next: 'القضيّة التالية', again: 'العب مرّة أخرى', menu: 'القائمة', locked: 'مقفلة',
    pause: 'استراحة', resume: 'تابع', quit: 'القائمة', close: 'إغلاق'
  },
  en: {
    age: 'How old are you?', title: 'Little Detective', titleG: 'Little Detective',
    tagline: 'Explore Souq Al-Mubarakiya, read what people say, and collect clues to solve the case! For ages 8–12.',
    me: 'Detective', meG: 'Detective', go: "Let's go,",
    levels: [['The Lost Cat', 'Case 1'], ['The Mystery Letter', 'Case 2'], ['The Missing Pearl', 'Case 3']],
    howto: '<b>Walk</b> arrow keys, tap the ground or use the joystick<br><b>Talk</b> walk up to someone and press the button or Space<br><b>Solve</b> collect every clue, then choose the answer',
    play: 'Start the case!', talk: 'Talk', inspect: 'Inspect', notebook: 'Clue notebook', clues: 'Clues', solve: 'Solve the case', lvl: 'Case',
    right: 'Correct! You got a clue', rightG: 'Correct! You got a clue', rightSolve: 'Correct! Head to the place you chose.', rightSolveG: 'Correct! Head to the place you chose.', wrong: 'Read it again and try', cont: 'Continue',
    find: 'Find the clues', allClues: 'You have every clue! Press "Solve the case"', allCluesG: 'You have every clue! Press "Solve the case"',
    solveQ: 'Think about the clues', goThere: 'Go there!', goThereG: 'Go there!', notYet: "You don't have every clue yet", notYetG: "You don't have every clue yet",
    solved: 'Case solved!', win: 'Well done, {n}!', winG: 'Well done, {n}!', accuracy: 'Accuracy', learned: 'Clues you collected', next: 'Next case', again: 'Play again', menu: 'Menu', locked: 'Locked',
    pause: 'Paused', resume: 'Resume', quit: 'Menu', close: 'Close'
  }
};
const t = k => { const v = T[lang][k]; if (G && T[lang][k + 'G'] !== undefined) return T[lang][k + 'G']; return v; };

// ---------- the people of the souq ----------
const PEOPLE = {
  dates: { name: 'العمّ سالم', role: 'بائع التّمر', model: 'npcDates', col: 0xc98a3a },
  perfume: { name: 'أمّ فهد', role: 'بائعة العطور', model: 'npcPerfume', col: 0x5a3d8a },
  fisher: { name: 'حمد', role: 'الصّيّاد', model: 'npcFisher', col: 0x3d8ac9 },
  tailor: { name: 'أبو ناصر', role: 'الخيّاط', model: 'npcTailor', col: 0x8a6b3d }
};
// places on the souq square (x, z) — shops face the centre
const PLACES = {
  dates: { x: -9, z: -8, label: 'بسطة التّمر' },
  perfume: { x: 9, z: -8, label: 'دكّان العطور' },
  tailor: { x: -9, z: 6, label: 'دكّان الخيّاط' },
  sea: { x: 9, z: 6, label: 'بوّابة البحر' }

  const ring = mesh(new THREE.RingGeometry(0.9, 1.3, 32), new THREE.MeshBasicMaterial({ color: 0xffd23f, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.06; g.add(ring);

function openBook() { if (state !== 'play') return; state = 'book'; $('book').classList.remove('hidden'); $('bookT').textContent = t('notebook'); $('bookList').innerHTML = clues.length ? clues.map(c => `<li>${c}</li>`).join('') : '<li>–</li>'; $('bookClose').textContent = t('close'); }
$('bookClose').onclick = () => { $('book').classList.add('hidden'); state = 'play'; last = performance.now(); };
let toastT = 0; function toastMsg(m, s = 1.1) { const e = $('toast'); e.textContent = m; e.classList.add('on'); toastT = s; }

// ---------- particles ----------
const parts = [];

// ---------- input ----------
addEventListener('keydown', e => {

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

let joyId = null, joyC = null; const joy = $('joy'), knob = $('knob');
joy.addEventListener('pointerdown', e => { e.stopPropagation(); joyId = e.pointerId; const r = joy.getBoundingClientRect(); joyC = { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 }; joy.setPointerCapture(e.pointerId); joyMove(e); });

// ---------- update ----------
function update(dt) {
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.v.y -= 12 * dt; p.m.position.addScaledVector(p.v, dt); if (p.life <= 0) { scene.remove(p.m); parts.splice(i, 1); } }
  if (state === 'reveal') { revealT += dt; npcs.forEach(n => { if (n.dest) n.g.position.lerp(n.dest, Math.min(1, dt * 1.5)); }); }
  if (state !== 'play') { P.vx = P.vz = 0; return; }

  // what can we talk to?

// ---------- visuals ----------
let time = 0;

  if (!det) return;

// ---------- hero card on the start screen: the child's real 3D character, turning slowly ----------
