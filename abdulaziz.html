<style>
:root{--ink:#10233f;--cream:#fff8ec;--sun:#ffc93c;--line:#10233f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;color:var(--ink);background:linear-gradient(#4fb3ff,#8fd3ff 60%,#ffe2a8);display:flex;justify-content:center;padding:24px 16px}
main{width:min(560px,100%)}
h1{margin:8px 0 4px;text-align:center;font-size:clamp(34px,9vw,52px);color:#fff;-webkit-text-stroke:2px var(--line);text-shadow:0 5px 0 var(--line)}
p.sub{text-align:center;margin:0 0 18px;font-weight:700}
a.game{display:flex;align-items:center;gap:14px;background:var(--cream);border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:14px 18px;margin:0 0 16px;text-decoration:none;color:inherit}
a.game:active{transform:translateY(3px);box-shadow:0 3px 0 var(--line)}
.emo{font-size:46px}
.thumb{width:104px;height:104px;flex:none;border-radius:18px;border:3px solid var(--line);object-fit:cover;box-shadow:0 3px 0 var(--line)}
@media (max-width:420px){.thumb{width:84px;height:84px}}
.game b{font-size:24px;display:block}
.game small{font-size:15px;font-weight:600;display:block;line-height:1.4}
.note{background:#ffffffcc;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.6}
</style>
