<style>
/* Layout: sky-blue page; big chunky title with Abdullah waving; three game cards (stacked on phones, side by side on wide screens); sticker book; a calm grown-ups panel at the end */
:root{
  --sky:#8fd3ff; --skyTop:#4fb3ff; --ink:#1d2a4a; --sun:#ffc93c; --leaf:#3fb85c; --coral:#ff5f6d; --teal:#18b5a6; --grape:#8a5cf0; --sea:#2f7de1; --paper:#fffaf0; --mute:#5b6787;
  --font:"Baloo Bhaijaan 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme: light;
}
html{background:var(--skyTop)}
body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--skyTop) 0,var(--sky) 360px,#dff4ff 900px,#fff6e0 100%);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:18px 40px;display:grid;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:700;font-size:14px;color:#fff;background:rgba(29,42,74,.25);border-radius:999px;padding:3px 12px}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;font-family:var(--font);font-weight:800;font-size:14px;padding:4px 12px;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.hero img{height:170px;width:auto;grid-row:span 2;filter:drop-shadow(0 8px 0 rgba(29,42,74,.2));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hero h1{margin:0;font-weight:800;font-size:clamp(40px,10vw,76px);line-height:1;color:var(--sun);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);text-wrap:balance}
.hero p{margin:0;font-size:17px;line-height:1.5;font-weight:500;max-width:52ch}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.game{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.scene{height:190px;position:relative;border-bottom:3px solid var(--ink);background:#8fd3ff}
.scene img{width:100%;height:100%;max-width:100%;display:block;object-fit:cover;object-position:50% 45%}
.body{padding:12px 16px 16px;display:grid;gap:8px;align-content:start}
.body h2{margin:0;font-weight:800;font-size:26px;line-height:1.1}
.body p{margin:0;font-size:15px;line-height:1.45;font-weight:500}
.skills{display:flex;flex-wrap:wrap;gap:5px}
.skills span{font-size:12.5px;font-weight:800;border-radius:999px;padding:1px 10px;border:2px solid var(--ink);background:#fff}
.prog{font-size:14px;font-weight:700;color:var(--mute);min-height:20px}
.play{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:800;font-size:22px;line-height:1.2;border:3px solid var(--ink);color:#fff;border-radius:16px;padding:6px 20px;box-shadow:0 5px 0 var(--ink);text-decoration:none;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;margin-top:4px}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.play:focus-visible,.lang button:focus-visible,summary:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.g1 .play{background:var(--leaf)} .g2 .play{background:var(--coral)} .g3 .play{background:var(--sea)}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:16px 18px 18px;display:grid;gap:12px}
.panel h2{margin:0;font-weight:800;font-size:26px;line-height:1.1;display:flex;align-items:center;gap:10px}
.panel h2 small{font-size:15px;font-weight:700;color:var(--mute)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.st{aspect-ratio:3/4;border-radius:14px;background:#fff;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink),0 4px 0 2px var(--ink);display:grid;place-items:center;align-content:center;gap:2px;position:relative;overflow:hidden;padding:3px}
.st:nth-child(3n){transform:rotate(-3deg)}.st:nth-child(3n+1){transform:rotate(2deg)}
.st .e{font-family:var(--emoji);font-size:32px;line-height:1.1}
.st .e.l{font-family:var(--font);font-weight:800;font-size:38px;color:var(--sea)}
.st .e svg{width:36px;height:36px}
.st .w{font-weight:800;font-size:12.5px;line-height:1.15;text-align:center}
.st .from{position:absolute;bottom:3px;inset-inline-end:4px;width:9px;height:9px;border-radius:50%}
.empty{background:#fff;border:2px dashed rgba(29,42,74,.35);border-radius:16px;padding:14px;font-weight:600;color:var(--mute);text-align:center}
details.panel>summary{list-style:none;cursor:pointer}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h2::after{content:"+";margin-inline-start:auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:20px}
details[open].panel>summary h2::after{content:"–"}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rcard{background:#f3f8ff;border:2px solid rgba(29,42,74,.2);border-radius:16px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.rcard h3{margin:0;font-size:16px;font-weight:800}
.rcard p{margin:0;font-size:14px;line-height:1.45}
.bar{height:14px;border-radius:999px;background:#fff;border:2px solid var(--ink);overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8ec5ff,var(--teal))}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{min-width:28px;height:28px;padding:0 4px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:16px;border:2px solid var(--ink);background:#fff6d6}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mute);margin:0}
footer{text-align:center;font-size:13px;color:var(--mute);font-weight:600}
@media (max-width:820px){.games{grid-template-columns:1fr}.scene{height:180px}}
@media (max-width:460px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.hero img{grid-row:auto;height:140px}}
@media (prefers-reduced-motion: reduce){.hero img{animation:none}}
</style>

const TOWERS = '<svg viewBox="0 0 40 40"><path d="M14 38V8M26 38V14M20 38V24" stroke="#1d2a4a" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="18" r="6" fill="#2f7de1" stroke="#1d2a4a" stroke-width="2"/><circle cx="14" cy="10" r="3.4" fill="#2f7de1" stroke="#1d2a4a" stroke-width="2"/><circle cx="26" cy="22" r="4.6" fill="#18b5a6" stroke="#1d2a4a" stroke-width="2"/></svg>';
const POSTS = { towers: [TOWERS, 'Kuwait Towers', 'أبراج الكويت'], dhow: ['⛵', 'The dhow', 'البوم'], failaka: ['🏝️', 'Failaka Island', 'جزيرة فيلكا'], pearl: ['🦪', 'Pearl diving', 'الغوص'], bridge: ['🌉', 'Sheikh Jaber Bridge', 'جسر الشيخ جابر'], camel: ['🐪', 'Camels', 'الجمل'], tent: ['⛺', 'Bait Al-Sha’ar', 'بيت الشعر'] };
const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
let lang = 'ar';
// Arabic is always the starting language; a switch to English only lasts for this visit
try { const wl = sessionStorage.getItem('abdullahworld.lang'); if (wl === 'ar' || wl === 'en') lang = wl; } catch (_) {}
const t = k => T[lang][k];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function render() {
  document.documentElement.lang = lang; document.documentElement.dir = t('dir');
  $('langEn').setAttribute('aria-pressed', lang === 'en'); $('langAr').setAttribute('aria-pressed', lang === 'ar');
  $('brand').textContent = t('brand'); $('title').textContent = t('title'); $('tagline').textContent = t('tagline');
  $('heroImg').alt = lang === 'ar' ? 'عبدالله يلوّح' : 'Abdullah waving';
  document.title = t('title');
  const sh = read('starhop.v3'), lk = read('letterkart.v2'), lg = read('letterglider.v1');
  for (const g of ['g1', 'g2', 'g3']) {
    $(g + 'n').textContent = t(g + 'n'); $(g + 'd').textContent = t(g + 'd');
    $(g + 's').innerHTML = t(g + 's').map(x => `<span>${esc(x)}</span>`).join('');
    const a = $(g + 'a'); a.href = LINKS[g]; a.textContent = t('play'); a.setAttribute('aria-label', `${t('play')}: ${t(g + 'n')}`);
    if (MODE !== 'package') { a.target = '_blank'; a.rel = 'noopener'; }
  }
  // per-game progress lines
  const doneN = sh && Array.isArray(sh.done) ? sh.done.filter(Boolean).length : 0;
  $('g1p').textContent = sh ? t('levelsDone')(doneN) : t('notYet');
  const kartCount = lk && lk.stickers ? Object.keys(lk.stickers[lang] || {}).length + Object.keys(lk.stickers.ach || {}).length : 0;
  $('g2p').textContent = lk ? t('stickers')(kartCount) : t('notYet');
  const L = lang === 'ar' ? AR_L : EN_L, abc = lg && lg.abc ? (lg.abc[lang] || 0) : 0, postN = lg && lg.post ? Object.keys(lg.post).length : 0;
  const abcDone = Math.min(L.length, lg && lg.abcCount && lg.abcCount[lang] != null ? lg.abcCount[lang] : abc);
  $('g3p').textContent = lg ? `${t('nextL')(L[abc % L.length])} · ${t('posts')(postN)}` : t('notYet');
  // sticker book (all games together)
  const items = [];
  if (lk && lk.stickers) { for (const w of Object.keys(lk.stickers[lang] || {})) items.push({ e: EMO[w] || '⭐', w, c: 'var(--coral)' }); for (const a of Object.keys(lk.stickers.ach || {})) items.push({ e: ACH[a] || '⭐', w: ACH_N[lang][a] || a, c: 'var(--coral)' }); }
  if (lg) {
    for (const p of Object.keys(lg.post || {})) if (POSTS[p]) items.push({ e: POSTS[p][0], raw: p === 'towers', w: lang === 'ar' ? POSTS[p][2] : POSTS[p][1], c: 'var(--sea)' });
    for (const w of Object.keys((lg.pics || {})[lang] || {})) if (!items.some(i => i.w === w)) items.push({ e: EMO[w] || '⭐', w, c: 'var(--sea)' });
    for (const k of Object.keys(lg.sky || {})) if (k.startsWith(lang)) items.push({ e: k.slice(2), letter: true, w: k.slice(2), c: 'var(--sea)' });
  }
  if (sh && Array.isArray(sh.done)) sh.done.forEach((d, i) => { if (d) items.push({ e: ['🏖️', TOWERS, '🌅'][i], raw: i === 1, w: `${t('g1n')} ${i + 1}`, c: 'var(--leaf)' }); });
  $('bookT').innerHTML = `${esc(t('bookT'))} <small class="num">${items.length ? esc(t('bookN')(items.length)) : ''}</small>`;
  $('book').innerHTML = items.length
    ? `<div class="stickers">${items.map(s => `<div class="st"><span class="e${s.letter ? ' l' : ''}">${s.raw ? s.e : esc(s.e)}</span><span class="w">${esc(s.w)}</span><span class="from" style="background:${s.c}"></span></div>`).join('')}</div>`
    : `<div class="empty">${esc(t('bookEmpty'))}</div>`;
  // grown-ups report
  const miss = lg && lg.miss ? (lg.miss[lang] || {}) : {}, tricky = Object.keys(miss).filter(c => miss[c] > 0).sort((a, b) => miss[b] - miss[a]).slice(0, 10);
  const words = new Set([...Object.keys((lk && lk.stickers && lk.stickers[lang]) || {}), ...Object.keys((lg && lg.pics && lg.pics[lang]) || {})]).size;
  const levelLines = [sh && sh.done ? sh.done.filter(Boolean).length : 0];
  $('grownT').textContent = t('grownT');
  $('report').innerHTML = `
    <div class="rcard"><h3>${esc(t('rAbc'))}</h3><div class="bar"><i style="width:${Math.round(abcDone / L.length * 100)}%"></i></div><p>${esc(t('rAbcT')(abcDone, L.length))}</p></div>
    <div class="rcard"><h3>${esc(t('rTricky'))}</h3>${tricky.length ? `<div class="chips">${tricky.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : `<p>${esc(t('rTrickyNone'))}</p>`}</div>
    <div class="rcard"><h3>${esc(t('rWords'))}</h3><p>${esc(t('rWordsT')(words))}</p></div>
    <div class="rcard"><h3>${esc(t('rPosts'))}</h3><div class="bar"><i style="width:${Math.round(postN / 7 * 100)}%"></i></div><p>${esc(t('rPostsT')(postN))}</p></div>
    <div class="rcard"><h3>${esc(t('rLevels'))}</h3><p>${esc(t('gameLv')[0])}: <span class="num">${levelLines[0]}/3</span></p></div>`;
  $('note').textContent = MODE === 'package' ? t('note') : t('previewNote');
  $('foot').textContent = t('foot');
}
// recorded greeting: plays when the page opens (if the browser allows sound) or on the first tap that isn't a game link
const hubAudio = new Audio(); let greeted = false, hubSeq = 0;
function hubSay(keys) {
  const my = ++hubSeq; let i = 0;
  const next = () => { if (my !== hubSeq || i >= keys.length) return; hubAudio.src = 'audio/' + lang + '/lines/' + keys[i++] + '.mp3'; hubAudio.onended = next; hubAudio.play().then(() => { greeted = true; }).catch(() => {}); };
  next();
}
function greet() { hubSay(['hub-welcome', 'hub-choose']); }
window.addEventListener('load', () => setTimeout(greet, 300));
document.addEventListener('pointerdown', e => { if (!greeted && !e.target.closest('a,button')) greet(); });
[['g1n', 'hub-game-hop'], ['g2n', 'hub-game-kart'], ['g3n', 'hub-game-glide']].forEach(([id, k]) => { const el = document.getElementById(id); if (el) { el.style.cursor = 'pointer'; el.addEventListener('click', () => { greeted = true; hubSay([k]); }); } });
function setLang(l) { lang = l; try { sessionStorage.setItem('abdullahworld.lang', l); } catch (_) {} render(); greet(); }
$('langEn').addEventListener('click', () => setLang('en'));
$('langAr').addEventListener('click', () => setLang('ar'));
window.addEventListener('pageshow', render);
window.addEventListener('storage', render);
render();
if (MODE === 'package' && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>

<script>/* menu tap sound */(function(){var c;function tap(){try{c=c||new (window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();var t=c.currentTime;[[880,520,0],[1320,990,0.012]].forEach(function(p){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(p[0],t+p[2]);o.frequency.exponentialRampToValueAtTime(p[1],t+p[2]+0.07);g.gain.setValueAtTime(0.0001,t+p[2]);g.gain.exponentialRampToValueAtTime(p[2]?0.06:0.16,t+p[2]+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]+0.1);o.connect(g);g.connect(c.destination);o.start(t+p[2]);o.stop(t+p[2]+0.12);});}catch(e){}}
document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('button,a,[role=button],#g1n,#g2n,#g3n,#kidsBox,label');if(!b||b.matches('.jump,.jumpBtn,.steer,.itemBtn,.upBtn'))return;tap();},true);})();</script>
<style>.musBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);inset-inline-start:14px;z-index:60;width:44px;height:44px;border-radius:50%;border:2px solid #1d2a4a;background:#fff;box-shadow:0 3px 0 #1d2a4a;display:grid;place-items:center;cursor:pointer;padding:0}.musBtn svg{width:22px;height:22px}.musBtn.inhud{position:static;width:38px;height:38px;pointer-events:auto;flex:none}.musBtn.top{position:static;width:36px;height:36px;box-shadow:0 2px 0 #1d2a4a;margin-inline-start:auto}</style>
<script>/* background music + mute button */(function(){var KEY='raneen.music',on=true;try{on=localStorage.getItem(KEY)!=='off'}catch(e){}
var a=new Audio('audio/music/music-hop.mp3');a.loop=true;a.volume=0.16;a.preload='auto';var started=false;
function play(){if(on&&!document.hidden){a.play().then(function(){started=true}).catch(function(){})}}
var ON='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#ffc93c" stroke="#1d2a4a" stroke-width="2" stroke-linejoin="round"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1d2a4a" stroke-width="2" stroke-linecap="round"/></svg>';
var OFF='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#dfe4ee" stroke="#1d2a4a" stroke-width="2" stroke-linejoin="round"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#ff5f6d" stroke-width="2.4" stroke-linecap="round"/></svg>';
var b=document.createElement('button');b.className='musBtn';b.type='button';
function paint(){b.innerHTML=on?ON:OFF;b.setAttribute('aria-label',on?'Music on':'Music off');b.setAttribute('aria-pressed',on?'true':'false')}paint();
['pointerdown','touchstart','mousedown'].forEach(function(t){b.addEventListener(t,function(e){e.stopPropagation()})});
b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();on=!on;try{localStorage.setItem(KEY,on?'on':'off')}catch(_){}if(on)play();else a.pause();paint();b.blur()});
function first(){play();if(started){document.removeEventListener('pointerdown',first,true);document.removeEventListener('keydown',first,true)}}
document.addEventListener('pointerdown',first,true);document.addEventListener('keydown',first,true);
document.addEventListener('visibilitychange',function(){if(document.hidden)a.pause();else if(started)play()});
window.addEventListener('pagehide',function(){a.pause()});
function place(){var hud=document.getElementById('hud'),top=document.querySelector('.top .lang');
 if(hud&&!hud.hidden){var row=hud.querySelector('.row'),hb=document.getElementById('homeBtn');if(row&&b.parentNode!==row){b.className='musBtn inhud';hb&&hb.nextSibling?row.insertBefore(b,hb.nextSibling):row.appendChild(b)}}
 else if(top){if(b.parentNode!==top.parentNode){b.className='musBtn top';top.parentNode.insertBefore(b,top)}}
 else if(b.parentNode!==document.body){b.className='musBtn';document.body.appendChild(b)}}
place();var hud=document.getElementById('hud');if(hud)new MutationObserver(place).observe(hud,{attributes:true,attributeFilter:['hidden']});
})();</script>
